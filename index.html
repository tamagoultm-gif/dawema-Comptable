<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dawema · Le Comptable</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;700&display=swap");
      :root {
        --ink: #0a1410;
        --panel: #10201a;
        --panel2: #15281f;
        --line: #23392e;
        --gold: #e8c468;
        --green: #5fd39a;
        --red: #f08c8c;
        --teal: #4ecab0;
        --cream: #f2ede1;
        --muted: #90a89b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: "Manrope", sans-serif;
        color: var(--cream);
        background: radial-gradient(
            1200px 500px at 80% -10%,
            rgba(232, 196, 104, 0.1),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 0% 110%,
            rgba(78, 202, 176, 0.08),
            transparent 55%
          ),
          var(--ink);
        min-height: 100vh;
        padding: 18px;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }
      h1,
      h2,
      h3 {
        font-family: "Bricolage Grotesque", sans-serif;
      }

      .hd {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .logo {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 24px;
        color: var(--ink);
        background: linear-gradient(135deg, var(--gold), #caa23f);
        box-shadow: 0 8px 24px rgba(232, 196, 104, 0.25);
      }
      .hd h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .hd .sub {
        color: var(--gold);
        font-weight: 700;
        font-size: 16px;
      }
      .tag {
        color: var(--muted);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .hd-actions {
        display: flex;
        gap: 8px;
      }
      .login {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
        background: radial-gradient(
            900px 500px at 50% 0%,
            rgba(232, 196, 104, 0.1),
            transparent 60%
          ),
          var(--ink);
      }
      .login-card {
        background: linear-gradient(135deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 24px;
        width: 100%;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      }
      .login-title {
        font-size: 20px;
        font-weight: 800;
      }
      .login-sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }
      .login-card .field {
        text-align: left;
      }
      .login-err {
        color: var(--red);
        font-size: 12.5px;
        min-height: 16px;
        margin: -4px 0 0;
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 10px;
        font-family: "Manrope";
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: 0.2s;
      }
      .ghost:hover {
        color: var(--cream);
        border-color: var(--gold);
      }
      .ghost.danger:hover {
        color: var(--red);
        border-color: var(--red);
      }

      .tabs {
        display: flex;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 6px;
        border-radius: 14px;
        margin-bottom: 18px;
        overflow-x: auto;
      }
      .tab {
        flex: 1;
        min-width: fit-content;
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 10px 12px;
        border-radius: 9px;
        font-family: "Manrope";
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
      }
      .tab.on {
        background: linear-gradient(135deg, var(--panel2), #1a2f24);
        color: var(--cream);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .tab:hover:not(.on) {
        color: var(--cream);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 28px;
        font-size: 14px;
      }

      .hero {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        background: linear-gradient(135deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        align-items: center;
      }
      .hero-l {
        flex: 1;
        min-width: 220px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hero-lbl {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .hero-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -1px;
      }
      .pos {
        color: var(--green);
      }
      .neg {
        color: var(--red);
      }
      .hero-meta {
        color: var(--muted);
        font-size: 12.5px;
      }
      .hero-r {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .mini {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        min-width: 120px;
      }
      .mini-lbl {
        display: block;
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .mini-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 18px;
      }

      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      @media (max-width: 640px) {
        .grid4 {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .kcard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .kc-ic {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 18px;
      }
      .kc-lbl {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .kc-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 17px;
        margin-top: 2px;
      }

      .scard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
      }
      .sc-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 26px;
      }
      .sc-lbl {
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 600;
        margin-top: 4px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .panel h3 {
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      @media (max-width: 560px) {
        .row3 {
          grid-template-columns: 1fr 1fr;
        }
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .field input,
      .field select {
        background: var(--ink);
        border: 1px solid var(--line);
        color: var(--cream);
        padding: 10px 12px;
        border-radius: 10px;
        font-family: "Manrope";
        font-size: 14px;
        outline: none;
        transition: 0.2s;
        width: 100%;
      }
      .field input:focus,
      .field select:focus {
        border-color: var(--gold);
      }
      .primary {
        background: linear-gradient(135deg, var(--gold), #caa23f);
        color: var(--ink);
        border: none;
        padding: 12px;
        border-radius: 12px;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 14.5px;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 2px;
      }
      .primary:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .list {
        padding: 8px;
      }
      .li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
      }
      .li:last-child {
        border-bottom: none;
      }
      .li-top {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .li-title {
        font-weight: 700;
        font-size: 14.5px;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 20px;
      }
      .fbar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .fpill {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 6px 12px;
        border-radius: 20px;
        font-family: "Manrope";
        font-weight: 700;
        font-size: 12.5px;
        cursor: pointer;
        transition: 0.2s;
      }
      .fpill.on {
        background: var(--panel2);
        color: var(--cream);
        border-color: var(--gold);
      }
      .fpill:hover:not(.on) {
        color: var(--cream);
      }
      .delall {
        margin-right: auto;
        background: transparent;
        border: none;
        color: var(--muted);
        font-family: "Manrope";
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: 0.2s;
      }
      .delall:hover {
        color: var(--red);
      }
      .pedit {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .pedit label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 10.5px;
        color: var(--muted);
        font-weight: 600;
      }
      .pedit input {
        width: 82px;
        background: var(--ink);
        border: 1px solid var(--line);
        color: var(--cream);
        padding: 6px 8px;
        border-radius: 8px;
        font-family: "Manrope";
        font-size: 13px;
        outline: none;
      }
      .pedit input:focus {
        border-color: var(--gold);
      }
      .ai-out {
        margin-top: 12px;
      }
      .ai-text {
        background: rgba(232, 196, 104, 0.06);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        color: var(--cream);
        font-size: 13.5px;
        line-height: 1.75;
      }
      .ai-text b {
        color: var(--gold);
      }
      .searchbox {
        width: 100%;
        background: var(--ink);
        border: 1px solid var(--line);
        color: var(--cream);
        padding: 10px 12px;
        border-radius: 10px;
        font-family: "Manrope";
        font-size: 14px;
        outline: none;
        margin: 0 0 10px;
      }
      .searchbox:focus {
        border-color: var(--gold);
      }
      @media print {
        body {
          background: #fff;
          color: #000;
        }
        .hd-actions,
        .tabs,
        .noprint,
        .del,
        .delall,
        .fpill,
        .fbar,
        .filebtn,
        .primary {
          display: none !important;
        }
        .panel {
          border: 1px solid #ccc;
          box-shadow: none;
          break-inside: avoid;
        }
        .hero,
        .kcard,
        .scard,
        .mini,
        .li-title,
        .kc-val,
        .sc-val,
        .pl,
        .hero-val,
        .ai-text {
          color: #000 !important;
        }
        .login {
          display: none !important;
        }
      }
      .statussel {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
        border: 1px solid;
        cursor: pointer;
        font-family: "Manrope";
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      .statussel option {
        background: var(--panel2);
        color: var(--cream);
      }
      .li-sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .li-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .pl {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 15px;
      }
      .pl.muted {
        color: var(--muted);
      }
      .del {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.2s;
      }
      .del:hover {
        color: var(--red);
        background: rgba(240, 140, 140, 0.12);
      }

      /* chart */
      .chart-wrap {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 240px;
        padding-top: 10px;
        overflow-x: auto;
      }
      .bar-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 34px;
        height: 100%;
      }
      .bars {
        display: flex;
        gap: 3px;
        align-items: flex-end;
        flex: 1;
        width: 100%;
        justify-content: center;
      }
      .bar {
        width: 11px;
        border-radius: 4px 4px 0 0;
        transition: 0.3s;
      }
      .bar.in {
        background: var(--green);
      }
      .bar.out {
        background: var(--red);
      }
      .bar-lbl {
        color: var(--muted);
        font-size: 10px;
      }
      .legend {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
      }
      .hint {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
        margin: -4px 0 2px;
      }
      .filebtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        background: rgba(78, 202, 176, 0.12);
        border: 1px dashed var(--teal);
        color: var(--teal);
        padding: 14px;
        border-radius: 12px;
        cursor: pointer;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 14px;
        transition: 0.2s;
      }
      .filebtn:hover {
        background: rgba(78, 202, 176, 0.2);
      }
      .filebtn input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="login" class="login">
      <div class="login-card">
        <div class="logo" style="margin: 0 auto 6px">D</div>
        <h2 class="login-title">Dawema · Le Comptable</h2>
        <p class="login-sub">Connecte-toi pour accéder au dashboard</p>
        <label class="field"
          ><span>Email</span
          ><input
            id="l_user"

        <label class="field"

      </div>

    <div class="wrap" id="appwrap" style="display: none">
      <div class="hd">
        <div class="brand">
          <div class="logo">D</div>
          <div>
            <h1>Dawema <span class="sub">· Le Comptable</span></h1>

          </div>
        </div>

            ↺ Réinitialiser

          <button class="ghost" onclick="logout()">⏻ Déconnexion</button>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>
      <div id="view" class="stack"></div>
    </div>

    <script>

   👉 Colle ici la config de TON projet Firebase
   (Firebase Console → Paramètres du projet → Tes applications → Web) */

   👉 Mets ta clé gratuite ici (openrouter.ai → Keys → Create Key) */

    <script>
      /* ---------- state ---------- */
      var orders = [],
        expenses = [],
        products = [];
      var _writeTimer = null;
      function save(k, v) {
        if (_writeTimer) clearTimeout(_writeTimer);
        _writeTimer = setTimeout(persist, 400);
      }
      function persist() {
        if (!fbAuth.currentUser) return;
        dataRef
          .set({ orders: orders, expenses: expenses, products: products })
          .catch(function (e) {
            console.error(e);
            alert("Erreur de sauvegarde : " + e.message);
          });
      }
      function subscribeData() {
        dataRef.onSnapshot(
          function (snap) {
            if (snap.exists) {
              var d = snap.data();
              orders = d.orders || [];
              expenses = d.expenses || [];
              products = d.products || [];
            } else {
              orders = [];
              expenses = [];
              products = [];
            }
            if (fbAuth.currentUser) render();
          },
          function (e) {
            console.error(e);
          }
        );
      }
      var tab = "home";
      var orderFilter = "all";
      var period = "all";
      var orderSearch = "";
      function inPeriod(dstr) {
        if (period === "all" || !dstr) return true;
        var t = new Date(dstr);
        if (isNaN(t.getTime())) return true;
        var now = new Date();
        if (period === "month")
          return (
            t.getFullYear() === now.getFullYear() &&
            t.getMonth() === now.getMonth()
          );
        var days = period === "7" ? 7 : 30;
        return t.getTime() >= now.getTime() - days * 86400000;
      }
      function setPeriod(p) {
        period = p;
        render();
      }

      /* ---------- utils ---------- */
      function num(v) {
        var n = parseFloat(v);
        return isNaN(n) ? 0 : n;
      }
      function today() {
        return new Date().toISOString().slice(0, 10);
      }
      function uid() {
        return Math.random().toString(36).slice(2, 9);
      }
      function fmt(n) {
        return (
          (Math.round(n * 100) / 100).toLocaleString("fr-FR", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2,
          }) + " DT"
        );
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      var STATUS = {
        delivered: { label: "Livrée", color: "var(--green)" },
        pending: { label: "En attente", color: "var(--gold)" },
        returned: { label: "Retour", color: "var(--red)" },
      };

      /* ---------- KPIs ---------- */
      function kpis() {
        var d = orders.filter(function (o) {
          return o.status === "delivered" && inPeriod(o.date);
        });
        var r = orders.filter(function (o) {
          return o.status === "returned" && inPeriod(o.date);
        });
        var p = orders.filter(function (o) {
          return o.status === "pending" && inPeriod(o.date);
        });
        var revenue = d.reduce(function (s, o) {
          return s + num(o.sell);
        }, 0);
        var cogs = d.reduce(function (s, o) {
          return s + num(o.buy);
        }, 0);
        var deliv =
          d.reduce(function (s, o) {
            return s + num(o.delivery);
          }, 0) +
          r.reduce(function (s, o) {
            return s + num(o.returnFee);
          }, 0);
        var ads = expenses
          .filter(function (e) {
            return e.type === "ads" && inPeriod(e.date);
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var other = expenses
          .filter(function (e) {
            return e.type !== "ads" && inPeriod(e.date);
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var out = cogs + deliv + ads + other,
          profit = revenue - out;
        var totalDR = d.length + r.length;
        return {
          revenue: revenue,
          cogs: cogs,
          deliv: deliv,
          ads: ads,
          other: other,
          out: out,
          profit: profit,
          margin: revenue > 0 ? (profit / revenue) * 100 : 0,
          roas: ads > 0 ? revenue / ads : 0,
          deliveryRate: totalDR > 0 ? (d.length / totalDR) * 100 : 0,
          profitPerOrder: d.length > 0 ? profit / d.length : 0,
          nD: d.length,
          nR: r.length,
          nP: p.length,
          nT: d.length + r.length + p.length,
        };
      }
      function daily() {
        var m = {};
        orders.forEach(function (o) {
          var dt = o.date || today();
          m[dt] = m[dt] || { date: dt, in: 0, out: 0 };
          if (o.status === "delivered") {
            m[dt].in += num(o.sell);
            m[dt].out += num(o.buy) + num(o.delivery);
          } else if (o.status === "returned") {
            m[dt].out += num(o.returnFee);
          }
        });
        expenses.forEach(function (e) {
          var dt = e.date || today();
          m[dt] = m[dt] || { date: dt, in: 0, out: 0 };
          m[dt].out += num(e.amount);
        });
        return Object.keys(m)
          .map(function (k) {
            return m[k];
          })
          .sort(function (a, b) {
            return a.date.localeCompare(b.date);
          })
          .slice(-14);
      }

      /* ---------- render ---------- */
      var TABS = [
        ["home", "Accueil"],
        ["orders", "Commandes"],
        ["expenses", "Dépenses"],
        ["products", "Produits"],
        ["analyse", "📊 Analyse"],
        ["rapports", "📈 Rapports"],
      ];
      function renderTabs() {
        document.getElementById("tabs").innerHTML = TABS.map(function (t) {
          return (
            '<button class="tab ' +
            (tab === t[0] ? "on" : "") +

            t[1] +
            "</button>"
          );
        }).join("");
      }
      function go(t) {
        tab = t;
        render();
      }

      function render() {
        renderTabs();
        var v = document.getElementById("view");
        if (tab === "home") v.innerHTML = viewHome();
        else if (tab === "orders") v.innerHTML = viewOrders();
        else if (tab === "expenses") v.innerHTML = viewExpenses();
        else if (tab === "products") v.innerHTML = viewProducts();
        else if (tab === "analyse") v.innerHTML = viewAnalyse();
        else if (tab === "rapports") v.innerHTML = viewRapports();
      }

      function viewHome() {
        var k = kpis(),
          d = daily();
        var maxV = Math.max(
          1,
          Math.max.apply(
            null,
            d.map(function (x) {
              return Math.max(x.in, x.out);
            })

        var bars =
          d.length === 0

                    '<div class="bar-group"><div class="bars">' +

                    fmt(x.in) +
                    '"></div>' +
                    '<div class="bar out" style="height:' +
                    (x.out / maxV) * 100 +
                    '%" title="Sorties ' +
                    fmt(x.out) +
                    '"></div>' +
                    '</div><div class="bar-lbl">' +
                    x.date.slice(5) +
                    "</div></div>"
                  );
                })
                .join("") +
              "</div>" +
              '<div class="legend"><span><i class="dot" style="background:var(--green)"></i>Entrées</span><span><i class="dot" style="background:var(--red)"></i>Sorties</span></div>';
        return (
          "" +
          '<div class="fbar">' +
          [
            ["all", "Tout"],
            ["month", "Ce mois"],
            ["30", "30 jours"],
            ["7", "7 jours"],
          ]
            .map(function (x) {
              return (
                '<button class="fpill ' +
                (period === x[0] ? "on" : "") +
                '" onclick="setPeriod(\'' +
                x[0] +
                "')\">" +
                x[1] +
                "</button>"
              );
            })
            .join("") +
          "</div>" +
          '<div class="hero"><div class="hero-l">' +
          '<span class="hero-lbl">Profit net</span>' +
          '<span class="hero-val ' +
          (k.profit >= 0 ? "pos" : "neg") +
          '">' +
          fmt(k.profit) +
          "</span>" +
          '<span class="hero-meta">Marge ' +
          k.margin.toFixed(1) +
          "% · Profit/commande " +
          fmt(k.profitPerOrder) +
          "</span>" +
          '</div><div class="hero-r">' +
          mini("Recettes", fmt(k.revenue), "var(--green)") +
          mini("Total dépenses", fmt(k.out), "var(--red)") +
          mini(
            "ROAS (rendement pub)",
            k.roas ? k.roas.toFixed(2) + "x" : "—",
            "var(--gold)"
          ) +
          "</div></div>" +
          '<div class="grid4">' +
          card("📣", "Dépenses pub", fmt(k.ads), "var(--gold)") +
          card("📦", "Coût d'achat", fmt(k.cogs), "var(--teal)") +
          card("🚚", "Frais de livraison", fmt(k.deliv), "var(--teal)") +
          card("👛", "Autres dépenses", fmt(k.other), "var(--muted)") +
          "</div>" +
          '<div class="grid3">' +
          stat("Livrées", k.nD, "var(--green)") +
          stat("Retours", k.nR, "var(--red)") +
          stat("En attente", k.nP, "var(--gold)") +
          "</div>" +
          '<div class="grid2">' +
          stat(
            "Taux de livraison",
            k.deliveryRate.toFixed(0) + "%",
            "var(--teal)"
          ) +
          stat("Total commandes", k.nT, "var(--cream)") +
          "</div>" +
          '<div class="panel"><h3>Entrées vs sorties · 14 derniers jours</h3>' +
          bars +
          "</div>"
        );
      }
      function mini(l, v, c) {
        return (
          '<div class="mini"><span class="mini-lbl">' +
          l +
          '</span><span class="mini-val" style="color:' +

      function card(ic, l, v, c) {

        var fbar =

            .join("") +

            : "") +
          "</div>";

        var shown = orders.filter(function (o) {
          return orderFilter === "all" || o.status === orderFilter;
        });
        var rows =
          shown.length === 0
            ? '<p class="empty">Aucune commande' +
              (orderFilter !== "all" ? " dans ce filtre" : "") +
              ".</p>"
            : shown
                .map(function (o) {
                  var st = STATUS[o.status],
                    profit = num(o.sell) - num(o.buy) - num(o.delivery);
                  var right =
                    o.status === "delivered"
                      ? '<span class="pl" style="color:' +
                        (profit >= 0 ? "var(--green)" : "var(--red)") +
                        '">' +
                        fmt(profit) +
                        "</span>"
                      : '<span class="pl muted">' +
                        fmt(num(o.sell)) +
                        "</span>";
                  var title = o.product || o.note || "Commande";
                  var client =
                    o.note && o.note !== title ? esc(o.note) + " · " : "";
                  return (
                    '<div class="li"><div class="li-main"><div class="li-top"><span class="li-title">' +
                    esc(title) +
                    "</span>" +
                    '<span class="badge" style="color:' +
                    st.color +
                    ";background:" +
                    st.color +
                    '22">' +
                    st.label +
                    "</span></div>" +
                    '<div class="li-sub">' +
                    client +
                    o.date +
                    " · Vente " +
                    fmt(num(o.sell)) +
                    " · Achat " +
                    fmt(num(o.buy)) +
                    " · Livraison " +
                    fmt(num(o.delivery)) +
                    "</div></div>" +
                    '<div class="li-right">' +
                    right +
                    '<button class="del" onclick="delOrder(\'' +
                    o.id +
                    "')\">🗑</button></div></div>"
                  );
                })
                .join("");
        var search =
          '<input id="o_search" class="searchbox" placeholder="🔎 Rechercher (nom, produit, ville…)" oninput="filterOrders(this.value)" value="' +
          esc(orderSearch) +
          '">';
        var list =
          '<div class="panel">' +
          fbar +
          search +
          '<div class="list" id="orders_list" style="padding:0">' +
          rows +
          "</div></div>";
        return importCard() + form + list;
      }
      function filterOrders(q) {
        orderSearch = q;
        var ql = (q || "").toLowerCase();
        var box = document.getElementById("orders_list");
        if (!box) return;
        var items = box.getElementsByClassName("li");
        for (var i = 0; i < items.length; i++) {
          var t = (items[i].textContent || "").toLowerCase();
          items[i].style.display = !ql || t.indexOf(ql) > -1 ? "" : "none";
        }
      }
      function setFilter(fl) {
        orderFilter = fl;
        render();
      }

          sell: sell,
          buy: buy,
          delivery: document.getElementById("o_deliv").value,

      /* ---------- CSV import ---------- */
      function importCard() {
        return (
          '<div class="panel form"><h3>⬆ Importer un CSV</h3>' +
          '<p class="hint">Importe tes commandes existantes (export Convertly, etc.). Les colonnes sont détectées automatiquement. ' +
          "⚠️ Le coût d'achat n'existe pas dans l'export : crée d'abord tes <b>Produits</b> (avec prix d'achat) pour un profit correct.</p>" +
          '<label class="filebtn">📄 Choisir un fichier CSV<input type="file" accept=".csv,text/csv" onchange="importCSV(event)"></label></div>'
        );
      }
      function pad(x) {
        x = String(x);
        return x.length < 2 ? "0" + x : x;
      }
      function parseDate(s) {
        if (!s) return today();
        s = String(s).split(",")[0].trim();
        var p = s.split(/[\/\-\.]/);
        if (p.length === 3) {
          if (p[0].length === 4)
            return p[0] + "-" + pad(p[1]) + "-" + pad(p[2]);
          return p[2] + "-" + pad(p[1]) + "-" + pad(p[0]);
        }
        var d = new Date(s);
        return isNaN(d.getTime()) ? today() : d.toISOString().slice(0, 10);
      }
      function mapStatus(s) {
        s = (s || "").toLowerCase();
        if (s.indexOf("deliver") > -1 || s.indexOf("livr") > -1)
          return "delivered";
        if (
          s.indexOf("return") > -1 ||
          s.indexOf("retour") > -1 ||
          s.indexOf("refus") > -1
        )
          return "returned";
        return "pending";
      }
      function cleanName(s) {
        s = String(s || "")
          .replace(/\s*[xX]\s*\d+\s*$/, "")
          .trim();
        s = s.replace(/\s*\([^()]*\)\s*$/, "").trim();
        return s;
      }
      function lineQty(s) {
        var m = String(s || "").match(/[xX]\s*(\d+)\s*$/);
        return m ? parseInt(m[1], 10) : 1;
      }
      function splitProducts(prodStr) {
        if (!prodStr) return [];
        return prodStr
          .split("|")
          .map(function (p) {
            return cleanName(p);
          })
          .filter(Boolean);
      }
      function costFromProducts(prodStr) {
        if (!prodStr || !products.length) return 0;
        var total = 0;
        prodStr.split("|").forEach(function (line) {
          var q = lineQty(line),
            nm = cleanName(line).toLowerCase();
          for (var i = 0; i < products.length; i++) {
            var pn = (products[i].name || "").toLowerCase().trim();
            if (pn && nm.indexOf(pn) > -1) {
              total += num(products[i].buy) * q;
              break;
            }
          }
        });
        return total;
      }
      function recalcCosts() {
        var n = 0;
        for (var i = 0; i < orders.length; i++) {
          if (orders[i].product) {
            orders[i].buy = costFromProducts(orders[i].product);
            n++;
          }
        }
        save("orders", orders);
        render();
        alert(
          "Coûts recalculés sur " + n + " commande(s) à partir des produits."
        );
      }
      function findCol(H, cands) {
        for (var i = 0; i < H.length; i++) {
          var h = (H[i] || "").toLowerCase().trim();
          for (var j = 0; j < cands.length; j++)
            if (h.indexOf(cands[j]) > -1) return i;
        }
        return -1;
      }
      function parseCSV(text) {
        text = text.replace(/^\uFEFF/, "");
        var rows = [],
          row = [],
          cur = "",
          q = false;
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          if (q) {
            if (ch == '"') {
              if (text[i + 1] == '"') {
                cur += '"';
                i++;
              } else q = false;
            } else cur += ch;
          } else {
            if (ch == '"') q = true;
            else if (ch == ",") {
              row.push(cur);
              cur = "";
            } else if (ch == "\n") {
              row.push(cur);
              rows.push(row);
              row = [];
              cur = "";
            } else if (ch == "\r") {
            } else cur += ch;
          }
        }
        if (cur !== "" || row.length) {
          row.push(cur);
          rows.push(row);
        }
        return rows;
      }
      function importCSV(ev) {
        var file = ev.target.files[0];
        if (!file) return;
        var rdr = new FileReader();
        rdr.onload = function () {
          var rows = parseCSV(rdr.result);
          if (rows.length < 2) {
            alert("Fichier vide ou illisible.");
            return;
          }
          var H = rows[0];
          var ci = {
            sell: findCol(H, ["total price", "total", "montant", "prix total"]),
            deliv: findCol(H, ["delivery price", "frais", "livraison"]),
            status: findCol(H, ["status", "statut", "etat", "état"]),
            date: findCol(H, ["delivered at", "created at", "date", "créé"]),
            name: findCol(H, ["name", "nom", "client"]),
            ref: findCol(H, [
              "reference",
              "référence",
              "ref",
              "order id",
              "id",
            ]),
            prod: findCol(H, ["product", "produit", "article", "item"]),
            qty: findCol(H, ["quantity", "quantité", "qte", "qty"]),
            city: findCol(H, [
              "city",
              "ville",
              "gouvernorat",
              "region",
              "région",
              "délégation",
            ]),
          };
          if (ci.sell < 0) {
            alert(
              "Colonne du montant introuvable. Vérifie que le CSV a une colonne 'Total Price' ou 'Montant'."
            );
            return;
          }
          var idx = {};
          orders.forEach(function (o) {
            if (o.ref) idx[o.ref] = o;
          });
          var existNames = {};
          products.forEach(function (p) {
            existNames[(p.name || "").toLowerCase().trim()] = true;
          });
          var newProds = {};
          var added = 0,
            updated = 0;
          for (var i = 1; i < rows.length; i++) {
            var r = rows[i];
            if (!r || (r.length === 1 && !r[0])) continue;
            var ref = ci.ref > -1 ? (r[ci.ref] || "").trim() : "";
            var qty = ci.qty > -1 ? num(r[ci.qty]) || 1 : 1;
            var prodStr = ci.prod > -1 ? r[ci.prod] || "" : "";
            var nm = ci.name > -1 ? (r[ci.name] || "").trim() : "";
            splitProducts(prodStr).forEach(function (pn) {
              var key = pn.toLowerCase().trim();
              if (pn && !existNames[key] && !newProds[key]) newProds[key] = pn;
            });
            var data = {
              sell: ci.sell > -1 ? num(r[ci.sell]) : 0,
              buy: costFromProducts(prodStr),
              delivery: ci.deliv > -1 ? num(r[ci.deliv]) : 0,
              status: mapStatus(ci.status > -1 ? r[ci.status] : ""),
              date: parseDate(ci.date > -1 ? r[ci.date] : ""),
              qty: qty,
              city: ci.city > -1 ? (r[ci.city] || "").trim() : "",
              note: nm || (prodStr ? prodStr.slice(0, 40) : "Commande " + ref),
              product: prodStr,
            };
            if (ref && idx[ref]) {
              var o = idx[ref];
              o.sell = data.sell;
              o.buy = data.buy;
              o.delivery = data.delivery;
              o.status = data.status;
              o.date = data.date;
              o.qty = data.qty;
              o.city = data.city;
              o.product = data.product;
              if (nm) o.note = nm;
              updated++;
              continue;
            }
            var no = { id: uid(), ref: ref, returnFee: "" };
            for (var key2 in data) no[key2] = data[key2];
            orders.unshift(no);
            if (ref) idx[ref] = no;
            added++;
          }
          var addedProds = 0;
          Object.keys(newProds).forEach(function (k) {
            products.push({
              id: uid(),
              name: newProds[k],
              sell: "",
              buy: "",
              delivery: "",
            });
            addedProds++;
          });
          save("orders", orders);
          save("products", products);
          render();
          alert(
            added +
              " commande(s) importée(s)" +
              (updated ? " · " + updated + " mise(s) à jour" : "") +
              (addedProds ? " · " + addedProds + " produit(s) ajouté(s)" : "")
          );
        };
        rdr.readAsText(file, "UTF-8");
        ev.target.value = "";
      }

      /* ===================== ANALYSE ===================== */
      function prodKey(o) {
        var p = splitProducts(o.product || "");
        return (p[0] || o.product || "Sans produit").trim() || "Sans produit";
      }
      function viewAnalyse() {
        var delivered = orders.filter(function (o) {
          return o.status === "delivered";
        });
        var returned = orders.filter(function (o) {
          return o.status === "returned";
        });
        if (orders.length === 0) {
          return '<div class="panel"><p class="empty">Pas encore de données. Importe ton CSV ou ajoute des commandes, puis reviens ici.</p></div>';
        }

        /* ---- par produit ---- */
        var P = {};
        delivered.forEach(function (o) {
          var k = prodKey(o);
          P[k] = P[k] || { name: k, rev: 0, profit: 0, n: 0, ret: 0 };
          P[k].rev += num(o.sell);
          P[k].profit += num(o.sell) - num(o.buy) - num(o.delivery);
          P[k].n++;
        });
        returned.forEach(function (o) {
          var k = prodKey(o);
          P[k] = P[k] || { name: k, rev: 0, profit: 0, n: 0, ret: 0 };
          P[k].ret++;
        });
        var plist = Object.keys(P)
          .map(function (k) {

        var prodRows =
          plist.length === 0
            ? '<p class="empty">Aucune vente livrée pour le moment.</p>'
            : plist
                .map(function (p) {
                  var tot = p.n + p.ret,

                  var col =

                    '">' +

                    "</span></div></div>"
                  );
                })
                .join("");

        /* ---- par ville ---- */
        var V = {};
        delivered.forEach(function (o) {
          var c = (o.city || "").trim() || "Inconnue";
          V[c] = V[c] || { name: c, rev: 0, profit: 0, n: 0 };
          V[c].rev += num(o.sell);
          V[c].profit += num(o.sell) - num(o.buy) - num(o.delivery);
          V[c].n++;
        });
        var vlist = Object.keys(V)
          .map(function (k) {
            return V[k];
          })
          .sort(function (a, b) {
            return b.rev - a.rev;
          });
        var hasCity = vlist.some(function (v) {
          return v.name !== "Inconnue";
        });
        var villeRows = !hasCity
          ? '<p class="hint" style="margin:0">Pas de villes enregistrées. Réimporte ton CSV (la colonne "City" sera lue automatiquement) pour voir où vont tes ventes.</p>'
          : vlist
              .slice(0, 12)
              .map(function (v) {
                return (
                  '<div class="li"><div class="li-main"><div class="li-top"><span class="li-title">' +
                  esc(v.name) +
                  "</span>" +
                  '<span class="badge" style="color:var(--gold);background:var(--gold)22">' +
                  v.n +
                  " cmd</span></div>" +
                  '<div class="li-sub">Profit: ' +
                  fmt(v.profit) +
                  "</div></div>" +
                  '<div class="li-right"><span class="pl">' +
                  fmt(v.rev) +
                  "</span></div></div>"
                );
              })
              .join("");

        /* ---- conseils pub (ROAS) ---- */
        var rev = delivered.reduce(function (s, o) {
          return s + num(o.sell);
        }, 0);
        var cogs = delivered.reduce(function (s, o) {
          return s + num(o.buy);
        }, 0);
        var delc = delivered.reduce(function (s, o) {
          return s + num(o.delivery);
        }, 0);
        var ads = expenses
          .filter(function (e) {
            return e.type === "ads";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var grossMargin = rev - cogs - delc; // avant pub
        var marginRatio = rev > 0 ? grossMargin / rev : 0;
        var roas = ads > 0 ? rev / ads : 0;
        var breakeven = marginRatio > 0 ? 1 / marginRatio : 0;
        var adsTxt = "";
        if (ads <= 0) {
          adsTxt =
            "Tu n'as pas encore enregistré de dépenses publicitaires. Ajoute-les dans l'onglet Dépenses pour calculer ton ROAS.";
        } else if (marginRatio <= 0) {
          adsTxt =
            "⚠️ Ta marge avant pub est négative : tu perds de l'argent même sans compter la pub. Revois tes prix d'achat / de vente avant de dépenser en pub.";
        } else {
          var status =
            roas >= breakeven * 1.3
              ? "🟢 Très rentable"
              : roas >= breakeven
              ? "🟡 Rentable, juste"
              : "🔴 En perte sur la pub";
          adsTxt =
            "Ton ROAS actuel est <b>" +
            roas.toFixed(2) +
            "x</b>. Ton seuil de rentabilité (break-even) est <b>" +
            breakeven.toFixed(2) +
            "x</b>. (" +
            status +
            ")<br>";
          if (roas >= breakeven * 1.3)
            adsTxt +=
              "👉 Tu gagnes bien sur chaque dinar de pub. Tu peux <b>augmenter le budget</b> progressivement (+20% à la fois) en surveillant le ROAS.";
          else if (roas >= breakeven)
            adsTxt +=
              "👉 Tu es rentable mais la marge est mince. <b>Optimise</b> (meilleures audiences/créatives) avant d'augmenter le budget.";
          else
            adsTxt +=
              "👉 Tu perds de l'argent sur la pub. <b>Baisse le budget</b>, coupe les pubs faibles, ou augmente la marge (prix/coût) avant de continuer.";
        }

        /* ---- alertes ---- */
        var alerts = [];
        var noCost = products.filter(function (p) {
          return !num(p.buy);
        });
        if (noCost.length)
          alerts.push(
            "🛒 " +
              noCost.length +
              " produit(s) sans prix d'achat — renseigne-les dans Produits puis clique « Recalculer les coûts » pour un profit exact."
          );
        plist.forEach(function (p) {
          if (p.profit < 0)
            alerts.push(
              "📉 « " +

            );
        });
        plist.forEach(function (p) {

        if (totDR >= 10) {

        var D = {};
        delivered.forEach(function (o) {

          if (d) {

        var alertsTxt = alerts.length

              .map(function (a) {
                return (
                  '<div class="li"><div class="li-main"><div class="li-sub" style="color:var(--cream);font-size:13px">' +
                  a +
                  "</div></div></div>"

        return (
          "" +

      function aiSummary() {
        var d = orders.filter(function (o) {
          return o.status === "delivered";
        });
        var r = orders.filter(function (o) {
          return o.status === "returned";
        });
        var p = orders.filter(function (o) {
          return o.status === "pending";
        });
        var rev = d.reduce(function (s, o) {
          return s + num(o.sell);
        }, 0);
        var cogs = d.reduce(function (s, o) {
          return s + num(o.buy);
        }, 0);
        var delc = d.reduce(function (s, o) {
          return s + num(o.delivery);
        }, 0);
        var ads = expenses
          .filter(function (e) {
            return e.type === "ads";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var other = expenses
          .filter(function (e) {
            return e.type !== "ads";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var profit = rev - cogs - delc - ads - other;
        var roas = ads > 0 ? (rev / ads).toFixed(2) : "0";
        var PR = {};
        d.forEach(function (o) {
          var k = prodKey(o);
          PR[k] = PR[k] || { n: 0, profit: 0, ret: 0 };
          PR[k].n++;
          PR[k].profit += num(o.sell) - num(o.buy) - num(o.delivery);
        });
        r.forEach(function (o) {
          var k = prodKey(o);
          PR[k] = PR[k] || { n: 0, profit: 0, ret: 0 };
          PR[k].ret++;
        });
        var prods = Object.keys(PR)
          .map(function (k) {
            return {
              name: k,
              n: PR[k].n,
              profit: Math.round(PR[k].profit),
              ret: PR[k].ret,
            };
          })
          .sort(function (a, b) {
            return b.profit - a.profit;
          })
          .slice(0, 10);
        var CI = {};
        d.forEach(function (o) {
          var c = (o.city || "").trim() || "Inconnue";
          CI[c] = CI[c] || { n: 0, rev: 0 };
          CI[c].n++;
          CI[c].rev += num(o.sell);
        });
        var cities = Object.keys(CI)
          .map(function (c) {
            return { name: c, n: CI[c].n, rev: Math.round(CI[c].rev) };
          })
          .sort(function (a, b) {
            return b.rev - a.rev;

        var s =

          ", retours=" +
          r.length +
          ", en attente=" +
          p.length +
          ".\n";

          "Chiffre d'affaires (livré)=" +

          " DT. Coût produits=" +
          Math.round(cogs) +
          ". Livraison=" +
          Math.round(delc) +
          ". Pub=" +
          Math.round(ads) +
          ". Autres=" +
          Math.round(other) +
          ".\n";
        s += "Profit net=" + Math.round(profit) + " DT. ROAS=" + roas + "x.\n";
        s +=
          "Produits (nom | vendus | profit DT | retours): " +
          prods
            .map(function (x) {
              return x.name + " | " + x.n + " | " + x.profit + " | " + x.ret;
            })
            .join(" ;; ") +
          "\n";
        s +=
          "Villes (nom | commandes | CA DT): " +
          (cities.length
            ? cities
                .map(function (x) {
                  return x.name + " | " + x.n + " | " + x.rev;
                })
                .join(" ;; ")
            : "non renseignées") +
          "\n";
        return s;
      }

          "IMPORTANT: ce sont des idées basées sur des connaissances générales (pas des données de marché en temps réel) — à tester avant d'investir.\n\nPRODUITS ACTUELS ET PERFORMANCES:\n" +
          aiSummary();
        askAI(prompt, out);
      }
      function askAI(prompt, out) {
        out.innerHTML =
          '<p class="hint">🤖 L\'IA réfléchit… (quelques secondes)</p>';
        fetch("https://openrouter.ai/api/v1/models")
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var free = (d.data || [])
              .filter(function (m) {
                var p = m.pricing || {};
                return (
                  String(p.prompt) === "0" &&
                  String(p.completion) === "0" &&
                  (m.id || "").indexOf(":free") > -1
                );
              })
              .map(function (m) {
                return m.id;
              });
            var pref = [
              "deepseek",
              "llama-3.3",
              "llama-3.1",
              "gemini",
              "qwen",
              "gemma",
              "mistral",
              "phi",
            ];
            free.sort(function (a, b) {
              function rk(x) {
                for (var i = 0; i < pref.length; i++)
                  if (x.indexOf(pref[i]) > -1) return i;
                return 99;
              }
              return rk(a) - rk(b);
            });
            if (!free.length) free = AI_MODELS;
            fetchAI(prompt, 0, out, "", free.slice(0, 10));
          })
          .catch(function () {
            fetchAI(prompt, 0, out, "", AI_MODELS);
          });
      }
      function fetchAI(prompt, i, out, lastErr, models) {
        if (i >= models.length) {
          out.innerHTML =
            '<p class="hint" style="color:var(--red)">Aucun modèle gratuit ne répond pour le moment. ' +
            esc(lastErr) +
            "<br>Réessaie dans 1-2 minutes.</p>";
          return;
        }
        fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + OPENROUTER_KEY,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            model: models[i],
            messages: [{ role: "user", content: prompt }],
          }),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            var txt = (((data.choices || [])[0] || {}).message || {}).content;
            if (txt) {
              out.innerHTML =
                '<div class="ai-text">' +
                esc(txt)
                  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
                  .replace(/^\s*[\*\-]\s/gm, "• ")
                  .replace(/\n/g, "<br>") +
                "</div>";
              return;
            }
            var em = data.error
              ? data.error.message || JSON.stringify(data.error)
              : "erreur inconnue";
            fetchAI(prompt, i + 1, out, em, models);
          })
          .catch(function (e) {
            fetchAI(prompt, i + 1, out, e.message, models);
          });
      }

      /* ===================== RAPPORTS ===================== */
      var MONTHS_FR = [
        "janv.",
        "févr.",
        "mars",
        "avr.",
        "mai",
        "juin",
        "juil.",
        "août",
        "sept.",
        "oct.",
        "nov.",
        "déc.",
      ];
      function monthLabel(k) {
        var p = k.split("-");
        if (p.length < 2) return k;
        var mi = parseInt(p[1], 10) - 1;
        return (MONTHS_FR[mi] || p[1]) + " " + p[0];
      }
      function monthData() {
        var m = {};
        function get(k) {
          m[k] = m[k] || {
            key: k,
            rev: 0,
            cogs: 0,
            deliv: 0,
            exp: 0,
            n: 0,
            ret: 0,
          };
          return m[k];
        }
        orders.forEach(function (o) {
          var k = (o.date || "").slice(0, 7);
          if (!k) return;
          if (o.status === "delivered") {
            var x = get(k);
            x.rev += num(o.sell);
            x.cogs += num(o.buy);
            x.deliv += num(o.delivery);
            x.n++;
          } else if (o.status === "returned") {
            var y = get(k);
            y.deliv += num(o.returnFee);
            y.ret++;
          }
        });
        expenses.forEach(function (e) {
          var k = (e.date || "").slice(0, 7);
          if (!k) return;
          get(k).exp += num(e.amount);
        });
        return Object.keys(m)
          .map(function (k) {
            var x = m[k];
            x.profit = x.rev - x.cogs - x.deliv - x.exp;
            return x;
          })
          .sort(function (a, b) {
            return b.key.localeCompare(a.key);
          });
      }
      function viewRapports() {
        var M = monthData();
        if (M.length === 0)
          return '<div class="panel"><p class="empty">Pas encore de données. Ajoute des commandes pour voir les rapports mensuels.</p></div>';
        /* comparaison ce mois vs mois précédent */
        var cur = M[0],
          prev = M[1];
        var cmp = "";
        if (prev) {
          var diff = cur.profit - prev.profit;
          var pct =
            prev.profit !== 0
              ? Math.round((diff / Math.abs(prev.profit)) * 100)
              : 0;
          var col = diff >= 0 ? "var(--green)" : "var(--red)";
          cmp =
            '<div class="panel"><h3>📊 ' +
            monthLabel(cur.key) +
            " vs " +
            monthLabel(prev.key) +
            "</h3>" +
            '<p class="hint" style="margin:0;color:var(--cream);line-height:1.8">Profit ce mois: <b style="color:' +
            col +
            '">' +
            fmt(cur.profit) +
            "</b> (" +
            (diff >= 0 ? "+" : "") +
            fmt(diff) +
            ", " +
            (pct >= 0 ? "+" : "") +
            pct +
            "%) vs " +
            fmt(prev.profit) +
            " le mois dernier.<br>" +
            "Commandes livrées: " +
            cur.n +
            " vs " +
            prev.n +
            ".</p></div>";
        }
        /* graphe profit par mois (12 derniers) */
        var chartM = M.slice(0, 12).slice().reverse();
        var maxP = Math.max(
          1,
          Math.max.apply(
            null,
            chartM.map(function (x) {
              return Math.abs(x.profit);
            })
          )
        );
        var chart =
          '<div class="chart-wrap">' +
          chartM
            .map(function (x) {
              var h = (Math.abs(x.profit) / maxP) * 100,
                col = x.profit >= 0 ? "var(--green)" : "var(--red)";
              return (
                '<div class="bar-group"><div class="bars"><div class="bar" style="height:' +
                h +
                "%;background:" +
                col +
                '" title="' +
                fmt(x.profit) +
                '"></div></div><div class="bar-lbl">' +
                x.key.slice(2) +
                "</div></div>"
              );
            })
            .join("") +
          "</div>";
        /* tableau mensuel */
        var rows = M.map(function (x) {
          var col = x.profit >= 0 ? "var(--green)" : "var(--red)";
          return (
            '<div class="li"><div class="li-main"><div class="li-top"><span class="li-title">' +
            monthLabel(x.key) +
            "</span>" +
            '<span class="badge" style="color:var(--teal);background:var(--teal)22">' +
            x.n +
            " livrées</span></div>" +
            '<div class="li-sub">CA ' +
            fmt(x.rev) +
            " · Achat " +
            fmt(x.cogs) +
            " · Livr. " +
            fmt(x.deliv) +
            " · Pub/autres " +
            fmt(x.exp) +
            "</div></div>" +
            '<div class="li-right"><span class="pl" style="color:' +
            col +
            '">' +
            fmt(x.profit) +
            "</span></div></div>"
          );
        }).join("");
        return (
          "" +
          '<div class="panel noprint"><button class="primary" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button></div>' +
          cmp +
          '<div class="panel"><h3>📈 Profit par mois</h3>' +
          chart +
          "</div>" +
          '<div class="panel"><h3>🗓️ Détail mensuel</h3><div class="list" style="padding:0">' +
          rows +
          "</div></div>"
        );
      }

      function f(label, inner) {
        return (
          '<label class="field"><span>' + label + "</span>" + inner + "</label>"
        );
      }

      /* ---------- actions ---------- */
      function resetAll() {
        if (!confirm("Tout supprimer ? Action irréversible.")) return;
        orders = [];
        expenses = [];
        products = [];
        save("orders", []);
        save("expenses", []);
        save("products", []);
        render();
      }
      function exportCSV() {
        var rows = [
          [
            "Type",
            "Date",
            "Description",
            "Prix vente",
            "Prix achat",
            "Livraison",
            "Statut",
            "Montant",
          ],
        ];
        orders.forEach(function (o) {
          rows.push([
            "Commande",
            o.date,
            o.note || o.product || "",
            o.sell,
            o.buy,
            o.delivery,
            (STATUS[o.status] || {}).label || "",
            "",
          ]);
        });
        expenses.forEach(function (e) {
          rows.push([
            "Dépense",
            e.date,
            e.desc || "",
            "",
            "",
            "",
            e.type === "ads" ? "Publicité" : "Autre",
            e.amount,
          ]);
        });
        var csv =
          "\uFEFF" +
          rows
            .map(function (r) {
              return r
                .map(function (c) {
                  return '"' + (c == null ? "" : c) + '"';
                })
                .join(";");
            })
            .join("\n");
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "dawema-comptable.csv";
        a.click();
      }

      /* ====== LOGIN (Firebase Auth) ====== */
      function showApp() {
        document.getElementById("login").style.display = "none";
        document.getElementById("appwrap").style.display = "block";
        render();
      }
      function showLogin() {
        document.getElementById("appwrap").style.display = "none";
        document.getElementById("login").style.display = "flex";
      }
      function doLogin() {
        var email = document.getElementById("l_user").value.trim(),
          pass = document.getElementById("l_pass").value;
        if (!email || !pass) {
          document.getElementById("l_err").textContent =
            "Remplis l'email et le mot de passe.";
          return;
        }
        document.getElementById("l_err").textContent = "Connexion…";
        fbAuth
          .signInWithEmailAndPassword(email, pass)
          .then(function () {
            document.getElementById("l_err").textContent = "";
            document.getElementById("l_pass").value = "";
          })
          .catch(function (e) {
            document.getElementById("l_err").textContent =
              "Email ou mot de passe incorrect.";
          });
      }
      function logout() {
        fbAuth.signOut();
      }
      var _subscribed = false;
      fbAuth.onAuthStateChanged(function (user) {
        if (user) {
          if (!_subscribed) {
            _subscribed = true;
            subscribeData();
          }
          showApp();
        } else {
          showLogin();
        }
      });
    </script>
  </body>
</html>
