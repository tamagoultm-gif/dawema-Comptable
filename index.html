<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dawema · Le Comptable</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;700&display=swap");
      :root {
        --ink: #0a1410;
        --panel: #10201a;
        --panel2: #15281f;
        --line: #23392e;
        --gold: #e8c468;
        --green: #5fd39a;
        --red: #f08c8c;
        --teal: #4ecab0;
        --cream: #f2ede1;
        --muted: #90a89b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: "Manrope", sans-serif;
        color: var(--cream);
        background: radial-gradient(
            1200px 500px at 80% -10%,
            rgba(232, 196, 104, 0.1),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 0% 110%,
            rgba(78, 202, 176, 0.08),
            transparent 55%
          ),
          var(--ink);
        min-height: 100vh;
        padding: 18px;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }
      h1,
      h2,
      h3 {
        font-family: "Bricolage Grotesque", sans-serif;
      }

      .hd {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .logo {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 24px;
        color: var(--ink);
        background: linear-gradient(135deg, var(--gold), #caa23f);
        box-shadow: 0 8px 24px rgba(232, 196, 104, 0.25);
      }
      .hd h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .hd .sub {
        color: var(--gold);
        font-weight: 700;
        font-size: 16px;
      }
      .tag {
        color: var(--muted);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .hd-actions {
        display: flex;
        gap: 8px;
      }
      .login {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
        background: radial-gradient(
            900px 500px at 50% 0%,
            rgba(232, 196, 104, 0.1),
            transparent 60%
          ),
          var(--ink);
      }
      .login-card {
        background: linear-gradient(135deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 24px;
        width: 100%;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      }
      .login-title {
        font-size: 20px;
        font-weight: 800;
      }
      .login-sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }
      .login-card .field {
        text-align: left;
      }
      .login-err {
        color: var(--red);
        font-size: 12.5px;
        min-height: 16px;
        margin: -4px 0 0;
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 10px;
        font-family: "Manrope";
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: 0.2s;
      }
      .ghost:hover {
        color: var(--cream);
        border-color: var(--gold);
      }
      .ghost.danger:hover {
        color: var(--red);
        border-color: var(--red);
      }

      .tabs {
        display: flex;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 6px;
        border-radius: 14px;
        margin-bottom: 18px;
        overflow-x: auto;
      }
      .tab {
        flex: 1;
        min-width: fit-content;
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 10px 12px;
        border-radius: 9px;
        font-family: "Manrope";
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
      }
      .tab.on {
        background: linear-gradient(135deg, var(--panel2), #1a2f24);
        color: var(--cream);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .tab:hover:not(.on) {
        color: var(--cream);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 28px;
        font-size: 14px;
      }

      .hero {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        background: linear-gradient(135deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        align-items: center;
      }
      .hero-l {
        flex: 1;
        min-width: 220px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hero-lbl {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .hero-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -1px;
      }
      .pos {
        color: var(--green);
      }
      .neg {
        color: var(--red);
      }
      .hero-meta {
        color: var(--muted);
        font-size: 12.5px;
      }
      .hero-r {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .mini {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        min-width: 120px;
      }
      .mini-lbl {
        display: block;
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .mini-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 18px;
      }

      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      @media (max-width: 640px) {
        .grid4 {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .kcard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .kc-ic {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 18px;
      }
      .kc-lbl {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .kc-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 17px;
        margin-top: 2px;
      }

      .scard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
      }
      .sc-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 26px;
      }
      .sc-lbl {
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 600;
        margin-top: 4px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .panel h3 {
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      @media (max-width: 560px) {
        .row3 {
          grid-template-columns: 1fr 1fr;
        }
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .field input,
      .field select {
        background: var(--ink);
        border: 1px solid var(--line);
        color: var(--cream);
        padding: 10px 12px;
        border-radius: 10px;
        font-family: "Manrope";
        font-size: 14px;
        outline: none;
        transition: 0.2s;
        width: 100%;
      }
      .field input:focus,
      .field select:focus {
        border-color: var(--gold);
      }
      .primary {
        background: linear-gradient(135deg, var(--gold), #caa23f);
        color: var(--ink);
        border: none;
        padding: 12px;
        border-radius: 12px;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 14.5px;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 2px;
      }
      .primary:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .list {
        padding: 8px;
      }
      .li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
      }
      .li:last-child {
        border-bottom: none;
      }
      .li-top {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .li-title {
        font-weight: 700;
        font-size: 14.5px;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 20px;
      }
      .fbar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .fpill {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 6px 12px;
        border-radius: 20px;
        font-family: "Manrope";
        font-weight: 700;
        font-size: 12.5px;
        cursor: pointer;
        transition: 0.2s;
      }
      .fpill.on {
        background: var(--panel2);
        color: var(--cream);
        border-color: var(--gold);
      }
      .fpill:hover:not(.on) {
        color: var(--cream);
      }
      .delall {
        margin-right: auto;
        background: transparent;
        border: none;
        color: var(--muted);
        font-family: "Manrope";
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: 0.2s;
      }
      .delall:hover {
        color: var(--red);
      }
      .pedit {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .pedit label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 10.5px;
        color: var(--muted);
        font-weight: 600;
      }
      .pedit input {
        width: 82px;
        background: var(--ink);
        border: 1px solid var(--line);
        color: var(--cream);
        padding: 6px 8px;
        border-radius: 8px;
        font-family: "Manrope";
        font-size: 13px;
        outline: none;
      }
      .pedit input:focus {
        border-color: var(--gold);
      }
      .statussel {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
        border: 1px solid;
        cursor: pointer;
        font-family: "Manrope";
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      .statussel option {
        background: var(--panel2);
        color: var(--cream);
      }
      .li-sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .li-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .pl {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 15px;
      }
      .pl.muted {
        color: var(--muted);
      }
      .del {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.2s;
      }
      .del:hover {
        color: var(--red);
        background: rgba(240, 140, 140, 0.12);
      }

      /* chart */
      .chart-wrap {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 240px;
        padding-top: 10px;
        overflow-x: auto;
      }
      .bar-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 34px;
        height: 100%;
      }
      .bars {
        display: flex;
        gap: 3px;
        align-items: flex-end;
        flex: 1;
        width: 100%;
        justify-content: center;
      }
      .bar {
        width: 11px;
        border-radius: 4px 4px 0 0;
        transition: 0.3s;
      }
      .bar.in {
        background: var(--green);
      }
      .bar.out {
        background: var(--red);
      }
      .bar-lbl {
        color: var(--muted);
        font-size: 10px;
      }
      .legend {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
      }
      .hint {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
        margin: -4px 0 2px;
      }
      .filebtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        background: rgba(78, 202, 176, 0.12);
        border: 1px dashed var(--teal);
        color: var(--teal);
        padding: 14px;
        border-radius: 12px;
        cursor: pointer;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 14px;
        transition: 0.2s;
      }
      .filebtn:hover {
        background: rgba(78, 202, 176, 0.2);
      }
      .filebtn input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="login" class="login">
      <div class="login-card">
        <div class="logo" style="margin: 0 auto 6px">D</div>
        <h2 class="login-title">Dawema · Le Comptable</h2>
        <p class="login-sub">Connecte-toi pour accéder au dashboard</p>
        <label class="field"
          ><span>Email</span
          ><input
            id="l_user"
            type="email"
            placeholder="email@exemple.com"
            autocomplete="username"
        /></label>
        <label class="field"
          ><span>Mot de passe</span
          ><input
            id="l_pass"
            type="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter')doLogin()"
        /></label>
        <p id="l_err" class="login-err"></p>
        <button class="primary" onclick="doLogin()">Se connecter</button>
      </div>
    </div>
    <div class="wrap" id="appwrap" style="display: none">
      <div class="hd">
        <div class="brand">
          <div class="logo">D</div>
          <div>
            <h1>Dawema <span class="sub">· Le Comptable</span></h1>
            <p class="tag">Recettes, dépenses & profit — en Dinar Tunisien</p>
          </div>
        </div>
        <div class="hd-actions">
          <button class="ghost" onclick="exportCSV()">⬇ Exporter</button>
          <button class="ghost danger" onclick="resetAll()">
            ↺ Réinitialiser
          </button>
          <button class="ghost" onclick="logout()">⏻ Déconnexion</button>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>
      <div id="view" class="stack"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
      /* ============ CONFIG FIREBASE ============
   👉 Colle ici la config de TON projet Firebase
   (Firebase Console → Paramètres du projet → Tes applications → Web) */
      var firebaseConfig = {
        apiKey: "AIzaSyAg3eQwQyktrS9jM94Upq1NDKExIORqvl0",
        authDomain: "dawema-1a265.firebaseapp.com",
        projectId: "dawema-1a265",
        storageBucket: "dawema-1a265.firebasestorage.app",
        messagingSenderId: "221464671913",
        appId: "1:221464671913:web:ed7479bdc3d7c36a40dbb8",
      };
      /* ========================================= */
      firebase.initializeApp(firebaseConfig);
      var fbAuth = firebase.auth();
      var db = firebase.firestore();
      var dataRef = db.collection("dawema").doc("data");
    </script>

    <script>
      /* ---------- state ---------- */
      var orders = [],
        expenses = [],
        products = [];
      var _writeTimer = null;
      function save(k, v) {
        if (_writeTimer) clearTimeout(_writeTimer);
        _writeTimer = setTimeout(persist, 400);
      }
      function persist() {
        if (!fbAuth.currentUser) return;
        dataRef
          .set({ orders: orders, expenses: expenses, products: products })
          .catch(function (e) {
            console.error(e);
            alert("Erreur de sauvegarde : " + e.message);
          });
      }
      function subscribeData() {
        dataRef.onSnapshot(
          function (snap) {
            if (snap.exists) {
              var d = snap.data();
              orders = d.orders || [];
              expenses = d.expenses || [];
              products = d.products || [];
            } else {
              orders = [];
              expenses = [];
              products = [];
            }
            if (fbAuth.currentUser) render();
          },
          function (e) {
            console.error(e);
          }
        );
      }
      var tab = "home";
      var orderFilter = "all";

      /* ---------- utils ---------- */
      function num(v) {
        var n = parseFloat(v);
        return isNaN(n) ? 0 : n;
      }
      function today() {
        return new Date().toISOString().slice(0, 10);
      }
      function uid() {
        return Math.random().toString(36).slice(2, 9);
      }
      function fmt(n) {
        return (
          (Math.round(n * 100) / 100).toLocaleString("fr-FR", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2,
          }) + " DT"
        );
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      var STATUS = {
        delivered: { label: "Livrée", color: "var(--green)" },
        pending: { label: "En attente", color: "var(--gold)" },
        returned: { label: "Retour", color: "var(--red)" },
      };

      /* ---------- KPIs ---------- */
      function kpis() {
        var d = orders.filter(function (o) {
          return o.status === "delivered";
        });
        var r = orders.filter(function (o) {
          return o.status === "returned";
        });
        var p = orders.filter(function (o) {
          return o.status === "pending";
        });
        var revenue = d.reduce(function (s, o) {
          return s + num(o.sell);
        }, 0);
        var cogs = d.reduce(function (s, o) {
          return s + num(o.buy);
        }, 0);
        var deliv =
          d.reduce(function (s, o) {
            return s + num(o.delivery);
          }, 0) +
          r.reduce(function (s, o) {
            return s + num(o.returnFee);
          }, 0);
        var ads = expenses
          .filter(function (e) {
            return e.type === "ads";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var other = expenses
          .filter(function (e) {
            return e.type !== "ads";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var out = cogs + deliv + ads + other,
          profit = revenue - out;
        var totalDR = d.length + r.length;
        return {
          revenue: revenue,
          cogs: cogs,
          deliv: deliv,
          ads: ads,
          other: other,
          out: out,
          profit: profit,
          margin: revenue > 0 ? (profit / revenue) * 100 : 0,
          roas: ads > 0 ? revenue / ads : 0,
          deliveryRate: totalDR > 0 ? (d.length / totalDR) * 100 : 0,
          profitPerOrder: d.length > 0 ? profit / d.length : 0,
          nD: d.length,
          nR: r.length,
          nP: p.length,
          nT: orders.length,
        };
      }
      function daily() {
        var m = {};
        orders.forEach(function (o) {
          var dt = o.date || today();
          m[dt] = m[dt] || { date: dt, in: 0, out: 0 };
          if (o.status === "delivered") {
            m[dt].in += num(o.sell);
            m[dt].out += num(o.buy) + num(o.delivery);
          } else if (o.status === "returned") {
            m[dt].out += num(o.returnFee);
          }
        });
        expenses.forEach(function (e) {
          var dt = e.date || today();
          m[dt] = m[dt] || { date: dt, in: 0, out: 0 };

      /* ---------- CSV import ---------- */
      function importCard() {
        return (
          '<div class="panel form"><h3>⬆ Importer un CSV</h3>' +
          '<p class="hint">Importe tes commandes existantes (export Convertly, etc.). Les colonnes sont détectées automatiquement. ' +
          "⚠️ Le coût d'achat n'existe pas dans l'export : crée d'abord tes <b>Produits</b> (avec prix d'achat) pour un profit correct.</p>" +
          '<label class="filebtn">📄 Choisir un fichier CSV<input type="file" accept=".csv,text/csv" onchange="importCSV(event)"></label></div>'
        );
      }
      function pad(x) {
        x = String(x);
        return x.length < 2 ? "0" + x : x;
      }
      function parseDate(s) {
        if (!s) return today();
        s = String(s).split(",")[0].trim();
        var p = s.split(/[\/\-\.]/);
        if (p.length === 3) {
          if (p[0].length === 4)
            return p[0] + "-" + pad(p[1]) + "-" + pad(p[2]);
          return p[2] + "-" + pad(p[1]) + "-" + pad(p[0]);
        }
        var d = new Date(s);
        return isNaN(d.getTime()) ? today() : d.toISOString().slice(0, 10);
      }
      function mapStatus(s) {
        s = (s || "").toLowerCase();
        if (s.indexOf("deliver") > -1 || s.indexOf("livr") > -1)
          return "delivered";
        if (
          s.indexOf("return") > -1 ||
          s.indexOf("retour") > -1 ||
          s.indexOf("refus") > -1
        )
          return "returned";
        return "pending";
      }
      function cleanName(s) {
        s = String(s || "")
          .replace(/\s*[xX]\s*\d+\s*$/, "")
          .trim();
        s = s.replace(/\s*\([^()]*\)\s*$/, "").trim();
        return s;
      }
      function lineQty(s) {
        var m = String(s || "").match(/[xX]\s*(\d+)\s*$/);
        return m ? parseInt(m[1], 10) : 1;
      }
      function splitProducts(prodStr) {
        if (!prodStr) return [];
        return prodStr
          .split("|")
          .map(function (p) {
            return cleanName(p);
          })
          .filter(Boolean);
      }
      function costFromProducts(prodStr) {
        if (!prodStr || !products.length) return 0;
        var total = 0;
        prodStr.split("|").forEach(function (line) {
          var q = lineQty(line),
            nm = cleanName(line).toLowerCase();
          for (var i = 0; i < products.length; i++) {
            var pn = (products[i].name || "").toLowerCase().trim();
            if (pn && nm.indexOf(pn) > -1) {
              total += num(products[i].buy) * q;
              break;
            }
          }
        });
        return total;
      }
      function recalcCosts() {
        var n = 0;
        for (var i = 0; i < orders.length; i++) {
          if (orders[i].product) {
            orders[i].buy = costFromProducts(orders[i].product);
            n++;
          }
        }
        save("orders", orders);
        render();
        alert(
          "Coûts recalculés sur " + n + " commande(s) à partir des produits."
        );
      }
      function findCol(H, cands) {
        for (var i = 0; i < H.length; i++) {
          var h = (H[i] || "").toLowerCase().trim();
          for (var j = 0; j < cands.length; j++)
            if (h.indexOf(cands[j]) > -1) return i;
        }
        return -1;
      }
      function parseCSV(text) {
        text = text.replace(/^\uFEFF/, "");
        var rows = [],
          row = [],
          cur = "",
          q = false;
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          if (q) {
            if (ch == '"') {
              if (text[i + 1] == '"') {
                cur += '"';
                i++;
              } else q = false;
            } else cur += ch;
          } else {
            if (ch == '"') q = true;
            else if (ch == ",") {
              row.push(cur);
              cur = "";
            } else if (ch == "\n") {
              row.push(cur);
              rows.push(row);
              row = [];
              cur = "";
            } else if (ch == "\r") {
            } else cur += ch;
          }
        }
        if (cur !== "" || row.length) {
          row.push(cur);
          rows.push(row);
        }
        return rows;
      }
      function importCSV(ev) {
        var file = ev.target.files[0];
        if (!file) return;
        var rdr = new FileReader();
        rdr.onload = function () {
          var rows = parseCSV(rdr.result);
          if (rows.length < 2) {
            alert("Fichier vide ou illisible.");
            return;
          }
          var H = rows[0];
          var ci = {
            sell: findCol(H, ["total price", "total", "montant", "prix total"]),
            deliv: findCol(H, ["delivery price", "frais", "livraison"]),
            status: findCol(H, ["status", "statut", "etat", "état"]),
            date: findCol(H, ["delivered at", "created at", "date", "créé"]),
            name: findCol(H, ["name", "nom", "client"]),
            ref: findCol(H, [
              "reference",
              "référence",
              "ref",
              "order id",
              "id",
            ]),
            prod: findCol(H, ["product", "produit", "article", "item"]),
            qty: findCol(H, ["quantity", "quantité", "qte", "qty"]),
          };
          if (ci.sell < 0) {
            alert(
              "Colonne du montant introuvable. Vérifie que le CSV a une colonne 'Total Price' ou 'Montant'."
            );
            return;
          }
          var idx = {};
          orders.forEach(function (o) {
            if (o.ref) idx[o.ref] = o;
          });
          var existNames = {};
          products.forEach(function (p) {
            existNames[(p.name || "").toLowerCase().trim()] = true;
          });
          var newProds = {};
          var added = 0,
            updated = 0;
          for (var i = 1; i < rows.length; i++) {
            var r = rows[i];
            if (!r || (r.length === 1 && !r[0])) continue;
            var ref = ci.ref > -1 ? (r[ci.ref] || "").trim() : "";
            var qty = ci.qty > -1 ? num(r[ci.qty]) || 1 : 1;
            var prodStr = ci.prod > -1 ? r[ci.prod] || "" : "";
            var nm = ci.name > -1 ? (r[ci.name] || "").trim() : "";
            splitProducts(prodStr).forEach(function (pn) {
              var key = pn.toLowerCase().trim();
              if (pn && !existNames[key] && !newProds[key]) newProds[key] = pn;
            });
            var data = {
              sell: ci.sell > -1 ? num(r[ci.sell]) : 0,
              buy: costFromProducts(prodStr),
              delivery: ci.deliv > -1 ? num(r[ci.deliv]) : 0,
              status: mapStatus(ci.status > -1 ? r[ci.status] : ""),
              date: parseDate(ci.date > -1 ? r[ci.date] : ""),
              qty: qty,
              note: nm || (prodStr ? prodStr.slice(0, 40) : "Commande " + ref),
              product: prodStr,
            };
            if (ref && idx[ref]) {
              var o = idx[ref];
              o.sell = data.sell;
              o.buy = data.buy;
              o.delivery = data.delivery;
              o.status = data.status;
              o.date = data.date;
              o.qty = data.qty;
              o.product = data.product;
              if (nm) o.note = nm;
              updated++;
              continue;
            }
            var no = { id: uid(), ref: ref, returnFee: "" };
            for (var key2 in data) no[key2] = data[key2];
            orders.unshift(no);
            if (ref) idx[ref] = no;
            added++;
          }
          var addedProds = 0;
          Object.keys(newProds).forEach(function (k) {
            products.push({
              id: uid(),
              name: newProds[k],
              sell: "",
              buy: "",
              delivery: "",
            });
            addedProds++;
          });
          save("orders", orders);
          save("products", products);
          render();
          alert(
            added +
              " commande(s) importée(s)" +
              (updated ? " · " + updated + " mise(s) à jour" : "") +
              (addedProds ? " · " + addedProds + " produit(s) ajouté(s)" : "")
          );
        };
        rdr.readAsText(file, "UTF-8");
        ev.target.value = "";
      }

      function f(label, inner) {
        return (
          '<label class="field"><span>' + label + "</span>" + inner + "</label>"
        );
      }

      /* ---------- actions ---------- */
      function resetAll() {
        if (!confirm("Tout supprimer ? Action irréversible.")) return;
        orders = [];
        expenses = [];
        products = [];
        save("orders", []);
        save("expenses", []);
        save("products", []);
        render();
      }
      function exportCSV() {
        var rows = [
          [
            "Type",
            "Date",
            "Description",
            "Prix vente",
            "Prix achat",
            "Livraison",
            "Statut",
            "Montant",
          ],
        ];
        orders.forEach(function (o) {
          rows.push([
            "Commande",
            o.date,
            o.note || o.product || "",
            o.sell,
            o.buy,
            o.delivery,
            (STATUS[o.status] || {}).label || "",
            "",
          ]);
        });
        expenses.forEach(function (e) {
          rows.push([
            "Dépense",
            e.date,
            e.desc || "",
            "",
            "",
            "",
            e.type === "ads" ? "Publicité" : "Autre",
            e.amount,
          ]);
        });
        var csv =
          "\uFEFF" +
          rows
            .map(function (r) {
              return r
                .map(function (c) {
                  return '"' + (c == null ? "" : c) + '"';
                })
                .join(";");
            })
            .join("\n");
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "dawema-comptable.csv";
        a.click();
      }

      /* ====== LOGIN (Firebase Auth) ====== */
      function showApp() {
        document.getElementById("login").style.display = "none";
        document.getElementById("appwrap").style.display = "block";
        render();
      }
      function showLogin() {
        document.getElementById("appwrap").style.display = "none";
        document.getElementById("login").style.display = "flex";
      }
      function doLogin() {
        var email = document.getElementById("l_user").value.trim(),
          pass = document.getElementById("l_pass").value;
        if (!email || !pass) {
          document.getElementById("l_err").textContent =
            "Remplis l'email et le mot de passe.";
          return;
        }
        document.getElementById("l_err").textContent = "Connexion…";
        fbAuth
          .signInWithEmailAndPassword(email, pass)
          .then(function () {
            document.getElementById("l_err").textContent = "";
            document.getElementById("l_pass").value = "";
          })
          .catch(function (e) {
            document.getElementById("l_err").textContent =
              "Email ou mot de passe incorrect.";
          });
      }
      function logout() {
        fbAuth.signOut();
      }
      var _subscribed = false;
      fbAuth.onAuthStateChanged(function (user) {
        if (user) {
          if (!_subscribed) {
            _subscribed = true;
            subscribeData();
          }
          showApp();
        } else {
          showLogin();
        }
      });
    </script>
  </body>
</html>
