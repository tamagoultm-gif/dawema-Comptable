<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dawema · Le Comptable</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;700&display=swap");
      :root {
        --ink: #0a1410;
        --panel: #10201a;
        --panel2: #15281f;
        --line: #23392e;
        --gold: #e8c468;
        --green: #5fd39a;
        --red: #f08c8c;
        --teal: #4ecab0;
        --cream: #f2ede1;
        --muted: #90a89b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: "Manrope", sans-serif;
        color: var(--cream);
        background: radial-gradient(
            1200px 500px at 80% -10%,
            rgba(232, 196, 104, 0.1),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 0% 110%,
            rgba(78, 202, 176, 0.08),
            transparent 55%
          ),
          var(--ink);
        min-height: 100vh;
        padding: 18px;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }
      h1,
      h2,
      h3 {
        font-family: "Bricolage Grotesque", sans-serif;
      }

      .hd {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .logo {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 24px;
        color: var(--ink);
        background: linear-gradient(135deg, var(--gold), #caa23f);
        box-shadow: 0 8px 24px rgba(232, 196, 104, 0.25);
      }
      .hd h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .hd .sub {
        color: var(--gold);
        font-weight: 700;
        font-size: 16px;
      }
      .tag {
        color: var(--muted);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .hd-actions {
        display: flex;
        gap: 8px;
      }
      .login {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
        background: radial-gradient(
            900px 500px at 50% 0%,
            rgba(232, 196, 104, 0.1),
            transparent 60%
          ),
          var(--ink);
      }
      .login-card {
        background: linear-gradient(135deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 24px;
        width: 100%;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      }
      .login-title {
        font-size: 20px;
        font-weight: 800;
      }
      .login-sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }
      .login-card .field {
        text-align: left;
      }
      .login-err {
        color: var(--red);
        font-size: 12.5px;
        min-height: 16px;
        margin: -4px 0 0;
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 10px;
        font-family: "Manrope";
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: 0.2s;
      }
      .ghost:hover {
        color: var(--cream);
        border-color: var(--gold);
      }
      .ghost.danger:hover {
        color: var(--red);
        border-color: var(--red);
      }

      .tabs {
        display: flex;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 6px;
        border-radius: 14px;
        margin-bottom: 18px;
        overflow-x: auto;
      }
      .tab {
        flex: 1;
        min-width: fit-content;
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 10px 12px;
        border-radius: 9px;
        font-family: "Manrope";
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
      }
      .tab.on {
        background: linear-gradient(135deg, var(--panel2), #1a2f24);
        color: var(--cream);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .tab:hover:not(.on) {
        color: var(--cream);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 28px;
        font-size: 14px;
      }

      .hero {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        background: linear-gradient(135deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        align-items: center;
      }
      .hero-l {
        flex: 1;
        min-width: 220px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hero-lbl {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .hero-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -1px;
      }
      .pos {
        color: var(--green);
      }
      .neg {
        color: var(--red);
      }
      .hero-meta {
        color: var(--muted);
        font-size: 12.5px;
      }
      .hero-r {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .mini {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        min-width: 120px;
      }
      .mini-lbl {
        display: block;
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .mini-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 18px;
      }

      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      @media (max-width: 640px) {
        .grid4 {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .kcard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .kc-ic {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 18px;
      }
      .kc-lbl {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .kc-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 17px;
        margin-top: 2px;
      }

      .scard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
      }
      .sc-val {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 26px;
      }
      .sc-lbl {
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 600;
        margin-top: 4px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .panel h3 {
        font-size: 15px;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      @media (max-width: 560px) {
        .row3 {
          grid-template-columns: 1fr 1fr;
        }
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .field input,
      .field select {
        background: var(--ink);
        border: 1px solid var(--line);
        color: var(--cream);
        padding: 10px 12px;
        border-radius: 10px;
        font-family: "Manrope";
        font-size: 14px;
        outline: none;
        transition: 0.2s;
        width: 100%;
      }
      .field input:focus,
      .field select:focus {
        border-color: var(--gold);
      }
      .primary {
        background: linear-gradient(135deg, var(--gold), #caa23f);
        color: var(--ink);
        border: none;
        padding: 12px;
        border-radius: 12px;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 14.5px;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 2px;
      }
      .primary:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .list {
        padding: 8px;
      }
      .li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
      }
      .li:last-child {
        border-bottom: none;
      }
      .li-top {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .li-title {
        font-weight: 700;
        font-size: 14.5px;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 20px;
      }
      .fbar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .fpill {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 6px 12px;
        border-radius: 20px;
        font-family: "Manrope";
        font-weight: 700;
        font-size: 12.5px;
        cursor: pointer;
        transition: 0.2s;
      }
      .fpill.on {
        background: var(--panel2);
        color: var(--cream);
        border-color: var(--gold);
      }
      .fpill:hover:not(.on) {
        color: var(--cream);
      }
      .delall {
        margin-right: auto;
        background: transparent;
        border: none;
        color: var(--muted);
        font-family: "Manrope";
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: 0.2s;
      }
      .delall:hover {
        color: var(--red);
      }
      .pedit {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .pedit label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 10.5px;
        color: var(--muted);
        font-weight: 600;
      }
      .pedit input {
        width: 82px;
        background: var(--ink);
        border: 1px solid var(--line);
        color: var(--cream);
        padding: 6px 8px;
        border-radius: 8px;
        font-family: "Manrope";
        font-size: 13px;
        outline: none;
      }
      .pedit input:focus {
        border-color: var(--gold);
      }
      .ai-out {
        margin-top: 12px;
      }
      .ai-text {
        background: rgba(232, 196, 104, 0.06);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        color: var(--cream);
        font-size: 13.5px;
        line-height: 1.75;
      }
      .alert-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 14px;
        color: var(--cream);
        line-height: 1.5;
      }
      .alert-msg b {
        color: var(--gold);
      }
      .goal-bar-bg {
        height: 10px;
        background: var(--line);
        border-radius: 99px;
        overflow: hidden;
      }
      .goal-bar-fill {
        height: 100%;
        border-radius: 99px;
        transition: width 0.4s;
      }
      .calc-rows {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .calc-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .calc-ic {
        font-size: 18px;
        width: 24px;
        text-align: center;
        flex-shrink: 0;
      }
      .calc-lbl {
        flex: 1;
        color: var(--cream);
        font-size: 14px;
      }
      .calc-val {
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
      }
      .calc-sep {
        border-top: 2px solid var(--gold);
        margin: 8px 0;
      }
      .calc-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--cream);
      }
      .ai-text b {
        color: var(--gold);
      }
      .searchbox {
        width: 100%;
        background: var(--ink);
        border: 1px solid var(--line);
        color: var(--cream);
        padding: 10px 12px;
        border-radius: 10px;
        font-family: "Manrope";
        font-size: 14px;
        outline: none;
        margin: 0 0 10px;
      }
      .searchbox:focus {
        border-color: var(--gold);
      }
      @media print {
        body {
          background: #fff;
          color: #000;
        }
        .hd-actions,
        .tabs,
        .noprint,
        .del,
        .delall,
        .fpill,
        .fbar,
        .filebtn,
        .primary {
          display: none !important;
        }
        .panel {
          border: 1px solid #ccc;
          box-shadow: none;
          break-inside: avoid;
        }
        .hero,
        .kcard,
        .scard,
        .mini,
        .li-title,
        .kc-val,
        .sc-val,
        .pl,
        .hero-val,
        .ai-text {
          color: #000 !important;
        }
        .login {
          display: none !important;
        }
      }
      .statussel {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
        border: 1px solid;
        cursor: pointer;
        font-family: "Manrope";
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      .statussel option {
        background: var(--panel2);
        color: var(--cream);
      }
      .li-sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .li-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .pl {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 15px;
      }
      .pl.muted {
        color: var(--muted);
      }
      .del {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.2s;
      }
      .del:hover {
        color: var(--red);
        background: rgba(240, 140, 140, 0.12);
      }

      /* chart */
      .chart-wrap {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 240px;
        padding-top: 10px;
        overflow-x: auto;
      }
      .bar-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 34px;
        height: 100%;
      }
      .bars {
        display: flex;
        gap: 3px;
        align-items: flex-end;
        flex: 1;
        width: 100%;
        justify-content: center;
      }
      .bar {
        width: 11px;
        border-radius: 4px 4px 0 0;
        transition: 0.3s;
      }
      .bar.in {
        background: var(--green);
      }
      .bar.out {
        background: var(--red);
      }
      .bar-lbl {
        color: var(--muted);
        font-size: 10px;
      }
      .legend {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
      }
      .hint {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
        margin: -4px 0 2px;
      }
      .filebtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        background: rgba(78, 202, 176, 0.12);
        border: 1px dashed var(--teal);
        color: var(--teal);
        padding: 14px;
        border-radius: 12px;
        cursor: pointer;
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        font-size: 14px;
        transition: 0.2s;
      }
      .filebtn:hover {
        background: rgba(78, 202, 176, 0.2);
      }
      .filebtn input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="login" class="login">
      <div class="login-card">
        <div class="logo" style="margin: 0 auto 6px">D</div>
        <h2 class="login-title">Dawema · Le Comptable</h2>
        <p class="login-sub">Connecte-toi pour accéder au dashboard</p>
        <label class="field"
          ><span>Email</span
          ><input
            id="l_user"
            type="email"
            placeholder="email@exemple.com"
            autocomplete="username"
        /></label>
        <label class="field"
          ><span>Mot de passe</span
          ><input
            id="l_pass"
            type="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter')doLogin()"
        /></label>
        <p id="l_err" class="login-err"></p>
        <button class="primary" onclick="doLogin()">Se connecter</button>
      </div>
    </div>
    <div class="wrap" id="appwrap" style="display: none">
      <div class="hd">
        <div class="brand">
          <div class="logo">D</div>
          <div>
            <h1>Dawema <span class="sub">· Le Comptable</span></h1>
            <p class="tag">Recettes, dépenses & profit — en Dinar Tunisien</p>
          </div>
        </div>
        <div class="hd-actions">
          <button class="ghost" onclick="exportCSV()">⬇ Exporter</button>
          <button class="ghost danger" onclick="resetAll()">
            ↺ Réinitialiser
          </button>
          <button class="ghost" onclick="logout()">⏻ Déconnexion</button>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>
      <div id="view" class="stack"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
      /* ============ CONFIG FIREBASE ============
   👉 Colle ici la config de TON projet Firebase
   (Firebase Console → Paramètres du projet → Tes applications → Web) */
      var firebaseConfig = {
        apiKey: "AIzaSyAg3eQwQyktrS9jM94Upq1NDKExIORqvl0",
        authDomain: "dawema-1a265.firebaseapp.com",
        projectId: "dawema-1a265",
        storageBucket: "dawema-1a265.firebasestorage.app",
        messagingSenderId: "221464671913",
        appId: "1:221464671913:web:ed7479bdc3d7c36a40dbb8",
      };
      /* ========================================= */
      firebase.initializeApp(firebaseConfig);
      var fbAuth = firebase.auth();
      var db = firebase.firestore();
      var dataRef = db.collection("dawema").doc("data");

      /* ====== IA via Cloudflare Worker (AI de Cloudflare, gratuit) ======
   Le Worker garde tout côté serveur. Aucune clé secrète ici. */
      var AI_PROXY = "https://dawema-ai.tamagoultm.workers.dev";
      /* =============================================================== */
      /* ================================================ */
    </script>

    <script>
      /* ---------- state ---------- */
      var orders = [],
        expenses = [],
        products = [];
      var _writeTimer = null;
      function save(k, v) {
        if (_writeTimer) clearTimeout(_writeTimer);
        _writeTimer = setTimeout(persist, 400);
      }
      function persist() {
        if (!fbAuth.currentUser) return;
        dataRef
          .set({ orders: orders, expenses: expenses, products: products })
          .catch(function (e) {
            console.error(e);
            alert("Erreur de sauvegarde : " + e.message);
          });
      }
      function subscribeData() {
        dataRef.onSnapshot(
          function (snap) {
            if (snap.exists) {
              var d = snap.data();
              orders = d.orders || [];
              expenses = d.expenses || [];
              products = d.products || [];
            } else {
              orders = [];
              expenses = [];
              products = [];
            }
            if (fbAuth.currentUser) render();
          },
          function (e) {
            console.error(e);
          }
        );
      }
      var tab = "home";
      var orderFilter = "all";
      var period = "all";
      var orderSearch = "";
      function inPeriod(dstr) {
        if (period === "all" || !dstr) return true;
        var t = new Date(dstr);
        if (isNaN(t.getTime())) return true;
        var now = new Date();
        if (period === "month")
          return (
            t.getFullYear() === now.getFullYear() &&
            t.getMonth() === now.getMonth()
          );
        var days = period === "7" ? 7 : 30;
        return t.getTime() >= now.getTime() - days * 86400000;
      }
      function setPeriod(p) {
        period = p;
        render();
      }

      /* ---------- utils ---------- */
      function num(v) {
        if (typeof v === "number") return isNaN(v) ? 0 : v;
        var s = String(v == null ? "" : v)
          .toLowerCase()
          .replace(/dt|tnd|dinars?|millimes?/g, "");
        s = s.replace(/[^\d.,\-]/g, "");
        if (s === "") return 0;
        if (s.indexOf(",") > -1 && s.indexOf(".") > -1) {
          if (s.lastIndexOf(",") > s.lastIndexOf("."))
            s = s.replace(/\./g, "").replace(",", ".");
          else s = s.replace(/,/g, "");
        } else if (s.indexOf(",") > -1) {
          s = s.replace(",", ".");
        }
        var n = parseFloat(s);
        return isNaN(n) ? 0 : n;
      }
      function today() {
        return new Date().toISOString().slice(0, 10);
      }
      function uid() {
        return Math.random().toString(36).slice(2, 9);
      }
      function fmt(n) {
        return (
          (Math.round(n * 100) / 100).toLocaleString("fr-FR", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2,
          }) + " DT"
        );
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      var STATUS = {
        delivered: { label: "Livrée", color: "var(--green)" },
        pending: { label: "En attente", color: "var(--gold)" },
        returned: { label: "Retour", color: "var(--red)" },
      };

      /* ---------- KPIs ---------- */
      function kpis() {
        var d = orders.filter(function (o) {
          return o.status === "delivered" && inPeriod(o.date);
        });
        var r = orders.filter(function (o) {
          return o.status === "returned" && inPeriod(o.date);
        });
        var p = orders.filter(function (o) {
          return o.status === "pending" && inPeriod(o.date);
        });
        var revenue = d.reduce(function (s, o) {
          return s + num(o.sell);
        }, 0);
        var cogs = d.reduce(function (s, o) {
          return s + num(o.buy);
        }, 0);
        var deliv =
          d.reduce(function (s, o) {
            return s + num(o.delivery);
          }, 0) +
          r.reduce(function (s, o) {
            return s + num(o.returnFee);
          }, 0);
        var ads = expenses
          .filter(function (e) {
            return e.type === "ads" && inPeriod(e.date);
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var achat = expenses
          .filter(function (e) {
            return e.type === "achat" && inPeriod(e.date);
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var emballage = expenses
          .filter(function (e) {
            return e.type === "emballage" && inPeriod(e.date);
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var other = expenses
          .filter(function (e) {
            return (
              e.type !== "ads" &&
              e.type !== "achat" &&
              e.type !== "emballage" &&
              inPeriod(e.date)
            );
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var out = achat + emballage + deliv + ads + other + cogs,
          profit = revenue - out;
        var totalDR = d.length + r.length;
        return {
          revenue: revenue,
          cogs: cogs,
          deliv: deliv,
          ads: ads,
          achat: achat,
          emballage: emballage,
          other: other,
          out: out,
          profit: profit,
          margin: revenue > 0 ? (profit / revenue) * 100 : 0,
          roas: ads > 0 ? revenue / ads : 0,
          deliveryRate: totalDR > 0 ? (d.length / totalDR) * 100 : 0,
          profitPerOrder: d.length > 0 ? profit / d.length : 0,
          nD: d.length,
          nR: r.length,
          nP: p.length,
          nT: d.length + r.length + p.length,
        };
      }
      function daily() {
        var m = {};
        orders.forEach(function (o) {
          var dt = o.date || today();
          m[dt] = m[dt] || { date: dt, in: 0, out: 0 };
          if (o.status === "delivered") {
            m[dt].in += num(o.sell);
            m[dt].out += num(o.buy) + num(o.delivery);
          } else if (o.status === "returned") {
            m[dt].out += num(o.returnFee);
          }
        });
        expenses.forEach(function (e) {
          var dt = e.date || today();
          m[dt] = m[dt] || { date: dt, in: 0, out: 0 };
          m[dt].out += num(e.amount);
        });
        return Object.keys(m)
          .map(function (k) {
            return m[k];
          })
          .sort(function (a, b) {
            return a.date.localeCompare(b.date);
          })
          .slice(-14);
      }

      /* ---------- render ---------- */
      var TABS = [
        ["home", "Accueil"],
        ["orders", "Commandes"],
        ["expenses", "Dépenses"],
        ["products", "Produits"],
        ["analyse", "📊 Analyse"],
        ["rapports", "📈 Rapports"],
      ];
      function renderTabs() {
        document.getElementById("tabs").innerHTML = TABS.map(function (t) {
          return (
            '<button class="tab ' +
            (tab === t[0] ? "on" : "") +
            '" onclick="go(\'' +
            t[0] +
            "')\">" +
            t[1] +
            "</button>"
          );
        }).join("");
      }
      function go(t) {
        tab = t;
        render();
      }

      function render() {
        renderTabs();
        var v = document.getElementById("view");
        if (tab === "home") v.innerHTML = viewHome();
        else if (tab === "orders") v.innerHTML = viewOrders();
        else if (tab === "expenses") v.innerHTML = viewExpenses();
        else if (tab === "products") v.innerHTML = viewProducts();
        else if (tab === "analyse") v.innerHTML = viewAnalyse();
        else if (tab === "rapports") v.innerHTML = viewRapports();
      }

      function viewHome() {

        /* ---- 2) HERO ---- */
        var hero =

        var cards =

          "</div>" +
          '<div class="grid2">' +
          stat(

            k.deliveryRate.toFixed(0) + "%",
            "var(--teal)"
          ) +
          stat("Total commandes", k.nT, "var(--cream)") +
          "</div>";

        /* ---- 4) OBJECTIF MENSUEL ---- */
        var goal = getGoal();
        var now = new Date();
        var daysInMonth = new Date(
          now.getFullYear(),
          now.getMonth() + 1,
          0
        ).getDate();
        var dayLeft = daysInMonth - now.getDate();
        var curKey = now.getFullYear() + "-" + pad(now.getMonth() + 1);
        var curM = monthData().filter(function (m) {
          return m.key === curKey;
        })[0];
        var curP = curM ? curM.profit : 0;
        var pct = goal > 0 ? Math.min(100, Math.round((curP / goal) * 100)) : 0;
        var gc =
          pct >= 100
            ? "var(--green)"
            : pct >= 60
            ? "var(--gold)"
            : "var(--red)";
        var goalHtml =
          '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
          '<h3 style="margin:0">🎯 Objectif mensuel</h3>' +
          '<button class="fpill on" onclick="setGoal()" style="font-size:12px">✏️ Modifier</button></div>' +
          (goal === 0
            ? '<p class="hint" style="margin:0">Pas encore d\'objectif. <button class="primary" style="display:inline;padding:6px 14px;font-size:13px;margin-left:8px" onclick="setGoal()">Définir</button></p>'
            : '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><span style="color:var(--muted)">Profit ce mois</span><span style="color:' +
              gc +
              ';font-weight:700">' +
              fmt(curP) +
              " / " +
              fmt(goal) +
              "</span></div>" +
              '<div class="goal-bar-bg"><div class="goal-bar-fill" style="width:' +
              pct +
              "%;background:" +

              '"></div></div>' +
              '<div style="margin-top:8px;font-size:13px;color:var(--muted)">' +
              (pct >= 100
                ? "✅ Objectif atteint ! Félicitations 🎉"
                : '<span style="color:' +
                  gc +
                  '">' +
                  pct +
                  "%</span> atteint · " +
                  dayLeft +
                  " jours restants" +
                  (dayLeft > 0 && curP < goal
                    ? ' · Besoin de <b style="color:var(--cream)">' +
                      fmt((goal - curP) / Math.max(1, dayLeft)) +
                      "</b>/jour"
                    : "")) +
              "</div>") +
          "</div>";

        /* ---- 5) GRAPHIQUE ---- */
        var maxV = Math.max(
          1,
          Math.max.apply(
            null,
            d.map(function (x) {
              return Math.max(x.in, x.out);
            })
          )
        );
        var bars =
          d.length === 0
            ? '<p class="empty">Pas encore de données.</p>'
            : '<div class="chart-wrap">' +
              d
                .map(function (x) {
                  return (
                    '<div class="bar-group"><div class="bars">' +
                    '<div class="bar in" style="height:' +
                    (x.in / maxV) * 100 +
                    '%" title="Recettes ' +
                    fmt(x.in) +
                    '"></div>' +
                    '<div class="bar out" style="height:' +

                })
                .join("") +
              "</div>" +
              '<div class="legend"><span><i class="dot" style="background:var(--green)"></i>Recettes</span><span><i class="dot" style="background:var(--red)"></i>Dépenses</span></div>';
        var chartHtml =
          '<div class="panel"><h3>📅 Recettes vs dépenses · 14 derniers jours</h3>' +
          bars +
          "</div>";

        return fbar + alertsHtml + hero + cards + goalHtml + chartHtml;
      }

      function getGoal() {
        try {
          return num(localStorage.getItem("dawema_goal") || "0");
        } catch (e) {
          return 0;
        }
      }
      function setGoal() {
        var cur = getGoal();
        var v = prompt("Objectif de profit mensuel (DT) :", cur > 0 ? cur : "");
        if (v === null) return;
        try {
          localStorage.setItem("dawema_goal", num(v));
        } catch (e) {}
        render();
      }
      function buildAlerts(k) {
        var a = [];
        /* objectif mensuel */
        var goal = getGoal();
        if (goal > 0) {
          var now = new Date();
          var curKey = now.getFullYear() + "-" + pad(now.getMonth() + 1);
          var curM = monthData().filter(function (m) {
            return m.key === curKey;
          })[0];
          var curP = curM ? curM.profit : 0;
          var pct = Math.round((curP / goal) * 100);
          var daysInMonth = new Date(
            now.getFullYear(),
            now.getMonth() + 1,
            0
          ).getDate();
          var dayPassed = now.getDate();
          var dayLeft = daysInMonth - dayPassed;
          if (curP >= goal)
            a.push({
              ic: "🎯",
              msg:
                "Objectif du mois atteint ! Tu as réalisé <b>" +
                fmt(curP) +
                "</b> / <b>" +
                fmt(goal) +
                "</b> DT 🎉",
            });
          else if (dayLeft <= 7 && pct < 70)
            a.push({
              ic: "⚡",
              msg:
                "Objectif en danger : <b>" +
                pct +
                "%</b> atteint, il reste <b>" +
                dayLeft +
                "</b> jours. Besoin de <b>" +
                fmt((goal - curP) / Math.max(1, dayLeft)) +
                "</b>/jour",
            });
        }
        /* comparaison mois */
        var M = monthData();
        var cur = M[0];
        var prev = M[1];
        if (cur && prev && prev.profit !== 0) {
          var diff = cur.profit - prev.profit;
          var pctM = Math.round((Math.abs(diff) / Math.abs(prev.profit)) * 100);
          if (diff > 0)
            a.push({
              ic: "📈",
              msg:
                "Ce mois le profit a augmenté de <b>" +
                fmt(diff) +
                "</b> vs le mois dernier (+" +
                pctM +
                "%)",
            });
          else if (diff < 0)
            a.push({
              ic: "📉",
              msg:
                "Ce mois le profit a baissé de <b>" +
                fmt(Math.abs(diff)) +
                "</b> vs le mois dernier (−" +
                pctM +
                "%)",
            });
        }
        /* taux retour */
        var tot = k.nD + k.nR;
        var retPct = tot > 0 ? Math.round((k.nR / tot) * 100) : 0;
        if (retPct >= 30)
          a.push({
            ic: "⚠️",
            msg:
              "Taux de retour élevé : <b>" +
              retPct +
              "%</b> des commandes retournées",
          });
        else if (retPct > 0 && retPct < 30)
          a.push({ ic: "↩️", msg: "Taux de retour : <b>" + retPct + "%</b>" });
        /* ROAS */
        if (k.ads > 0 && k.roas < 2)
          a.push({
            ic: "📣",
            msg:
              "ROAS faible (<b>" +
              k.roas.toFixed(2) +
              "x</b>) — chaque 1 DT pub rapporte " +
              k.roas.toFixed(2) +
              " DT",
          });
        /* perte */
        if (k.profit < 0)
          a.push({
            ic: "🔴",
            msg:
              "Tu es en perte de <b>" +
              fmt(Math.abs(k.profit)) +
              "</b> sur cette période",
          });
        return a;
      }
      function periodLabel() {
        var L = { all: "(tout)", month: "(ce mois)", 30: "(30j)", 7: "(7j)" };
        return L[period] || "";
      }
      function mini(l, v, c) {

        var fbar =

        var shown = orders.filter(function (o) {

        var rows =

                .map(function (o) {
                  var st = STATUS[o.status],
                    profit = num(o.sell) - num(o.buy) - num(o.delivery);
                  var right =
                    o.status === "delivered"
                      ? '<span class="pl" style="color:' +
                        (profit >= 0 ? "var(--green)" : "var(--red)") +
                        '">' +
                        fmt(profit) +
                        "</span>"
                      : '<span class="pl muted">' +
                        fmt(num(o.sell)) +
                        "</span>";
                  var title = o.product || o.note || "Commande";
                  var client =
                    o.note && o.note !== title ? esc(o.note) + " · " : "";
                  return (
                    '<div class="li"><div class="li-main"><div class="li-top"><span class="li-title">' +
                    esc(title) +
                    "</span>" +
                    '<span class="badge" style="color:' +
                    st.color +
                    ";background:" +
                    st.color +
                    '22">' +
                    st.label +
                    "</span></div>" +
                    '<div class="li-sub">' +
                    client +

                    fmt(num(o.sell)) +

                    fmt(num(o.buy)) +
                    " · Livraison " +
                    fmt(num(o.delivery)) +
                    "</div></div>" +
                    '<div class="li-right">' +
                    right +
                    '<button class="del" onclick="delOrder(\'' +
                    o.id +

                  );
                })
                .join("");
        var search =
          '<input id="o_search" class="searchbox" placeholder="🔎 Rechercher (nom, produit, ville…)" oninput="filterOrders(this.value)" value="' +
          esc(orderSearch) +
          '">';
        var list =
          '<div class="panel">' +
          fbar +
          search +
          '<div class="list" id="orders_list" style="padding:0">' +
          rows +
          "</div></div>";
        return importCard() + form + list;
      }
      function filterOrders(q) {
        orderSearch = q;
        var ql = (q || "").toLowerCase();
        var box = document.getElementById("orders_list");
        if (!box) return;
        var items = box.getElementsByClassName("li");

      /* ---------- CSV import ---------- */
      function importCard() {
        return (
          '<div class="panel form"><h3>⬆ Importer un CSV</h3>' +
          '<p class="hint">Importe tes commandes existantes (export Convertly, etc.). Les colonnes sont détectées automatiquement. ' +

          '<label class="filebtn">📄 Choisir un fichier CSV<input type="file" accept=".csv,text/csv" onchange="importCSV(event)"></label></div>'
        );
      }
      function pad(x) {
        x = String(x);
        return x.length < 2 ? "0" + x : x;
      }
      function parseDate(s) {
        if (!s) return today();
        s = String(s).split(",")[0].split(" ")[0].trim();
        var p = s.split(/[\/\-\.]/);
        if (p.length === 3) {
          if (p[0].length === 4)
            return p[0] + "-" + pad(p[1]) + "-" + pad(p[2]);
          return p[2] + "-" + pad(p[1]) + "-" + pad(p[0]);
        }
        var d = new Date(s);
        return isNaN(d.getTime()) ? today() : d.toISOString().slice(0, 10);
      }
      function mapStatus(s) {
        s = (s || "").toLowerCase().trim();
        if (
          s.indexOf("retour") > -1 ||
          s.indexOf("return") > -1 ||
          s.indexOf("refus") > -1
        )
          return "returned";
        if (
          s.indexOf("livraison") > -1 ||
          s.indexOf("attente") > -1 ||
          s.indexOf("report") > -1 ||
          s.indexOf("cours") > -1 ||
          s.indexOf("magasin") > -1 ||
          s.indexOf("annul") > -1 ||
          s.indexOf("abandon") > -1 ||
          s.indexOf("cancel") > -1 ||
          s.indexOf("pending") > -1
        )
          return "pending";
        if (
          s.indexOf("livr") > -1 ||
          s.indexOf("deliver") > -1 ||
          s.indexOf("payé") > -1 ||
          s.indexOf("paye") > -1
        )
          return "delivered";
        return "pending";
      }
      function canonName(n) {
        var L = String(n || "").toLowerCase();
        if (L.indexOf("moustix") > -1) return "Anti Moustix";
        if (
          L.indexOf("pack") > -1 &&
          (L.indexOf("sac") > -1 ||
            L.indexOf("voyage") > -1 ||
            L.indexOf("4en1") > -1 ||
            L.indexOf("4-en1") > -1 ||
            L.indexOf("urban") > -1)
        )
          return "Packs sacs 4-en1";
        if (
          L.indexOf("sac de voyage") > -1 ||
          L.indexOf("sac à dos") > -1 ||
          L.indexOf("sac a dos") > -1 ||
          L.indexOf("sac de sport") > -1 ||
          L.indexOf("sacoche") > -1
        )
          return "Packs sacs 4-en1";
        return n;
      }
      function cleanName(s) {
        s = String(s || "").trim();
        s = s.replace(/^\d+\s*[xX]\s*/, "");
        s = s.replace(/\s*[xX]\s*\d+\s*$/, "");
        s = s.replace(/\s*\([^()]*\)\s*$/, "").trim();
        return canonName(s);
      }
      function lineQty(s) {
        var m = String(s || "").match(/[xX]\s*(\d+)\s*$/);
        return m ? parseInt(m[1], 10) : 1;
      }
      function splitProducts(prodStr) {
        if (!prodStr) return [];
        return prodStr
          .split("|")
          .map(function (p) {
            return cleanName(p);
          })
          .filter(Boolean);
      }
      function costFromProducts(prodStr) {
        if (!prodStr || !products.length) return 0;
        var total = 0;
        prodStr.split("|").forEach(function (line) {
          var q = lineQty(line),
            nm = cleanName(line).toLowerCase();
          for (var i = 0; i < products.length; i++) {
            var pn = (products[i].name || "").toLowerCase().trim();
            if (pn && nm.indexOf(pn) > -1) {
              total += num(products[i].buy) * q;
              break;
            }
          }
        });
        return total;
      }
      function recalcCosts() {
        var n = 0;
        for (var i = 0; i < orders.length; i++) {
          if (orders[i].product) {
            orders[i].buy = costFromProducts(orders[i].product);
            n++;
          }
        }
        save("orders", orders);
        render();
        alert(
          "Coûts recalculés sur " + n + " commande(s) à partir des produits."
        );
      }
      function findCol(H, cands) {
        for (var i = 0; i < H.length; i++) {
          var h = (H[i] || "").toLowerCase().trim();
          for (var j = 0; j < cands.length; j++)
            if (h.indexOf(cands[j]) > -1) return i;
        }
        return -1;
      }
      function parseCSV(text) {
        text = text.replace(/^\uFEFF/, "");
        var rows = [],
          row = [],
          cur = "",
          q = false;
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          if (q) {
            if (ch == '"') {
              if (text[i + 1] == '"') {
                cur += '"';
                i++;
              } else q = false;
            } else cur += ch;
          } else {
            if (ch == '"') q = true;
            else if (ch == ",") {
              row.push(cur);
              cur = "";
            } else if (ch == "\n") {
              row.push(cur);
              rows.push(row);
              row = [];
              cur = "";
            } else if (ch == "\r") {
            } else cur += ch;
          }
        }
        if (cur !== "" || row.length) {
          row.push(cur);
          rows.push(row);
        }
        return rows;
      }
      function importCSV(ev) {
        var file = ev.target.files[0];
        if (!file) return;
        var rdr = new FileReader();
        rdr.onload = function () {
          var rows = parseCSV(rdr.result);
          if (rows.length < 2) {
            alert("Fichier vide ou illisible.");
            return;
          }
          var H = rows[0];
          var ci = {
            sell: findCol(H, ["total price", "total", "montant", "prix total"]),
            deliv: findCol(H, ["delivery price", "frais", "livraison"]),
            status: findCol(H, ["status", "statut", "etat", "état"]),
            date: findCol(H, ["delivered at", "created at", "date", "créé"]),
            name: findCol(H, ["name", "nom", "client"]),
            ref: findCol(H, [
              "reference",
              "référence",
              "ref",
              "order id",
              "order",
              "id",
              "code barres",
              "barres",
              "tracking",
              "suivi",
            ]),
            prod: findCol(H, ["product", "produit", "article", "item"]),
            qty: findCol(H, ["quantity", "quantité", "qte", "qty"]),
            city: findCol(H, [
              "city",
              "ville",
              "gouvernorat",
              "region",
              "région",
              "délégation",
            ]),
            phone: findCol(H, [
              "téléphone",
              "telephone",
              "phone",
              "gsm",
              "tel",
              "mobile",
            ]),
          };
          if (ci.sell < 0) {
            alert(
              "Colonne du montant introuvable. Vérifie que le CSV a une colonne 'Total Price' ou 'Montant'."
            );
            return;
          }
          var idx = {};
          orders.forEach(function (o) {
            if (o.ref) idx[o.ref] = o;
          });
          var existNames = {};
          products.forEach(function (p) {
            existNames[(p.name || "").toLowerCase().trim()] = true;
          });
          var newProds = {};
          var added = 0,
            updated = 0;
          for (var i = 1; i < rows.length; i++) {
            var r = rows[i];
            if (!r || (r.length === 1 && !r[0])) continue;
            var qty = ci.qty > -1 ? num(r[ci.qty]) || 1 : 1;
            var prodStr = ci.prod > -1 ? r[ci.prod] || "" : "";
            var nm = ci.name > -1 ? (r[ci.name] || "").trim() : "";
            var ref = ci.ref > -1 ? (r[ci.ref] || "").trim() : "";
            if (!ref || /^[\d.]+e[\+\-]?\d+$/i.test(ref.replace(/\s/g, ""))) {
              var ph = ci.phone > -1 ? (r[ci.phone] || "").trim() : "";
              var rawD = ci.date > -1 ? (r[ci.date] || "").trim() : "";
              var rawM = ci.sell > -1 ? (r[ci.sell] || "").trim() : "";
              ref = (ph + "|" + rawD + "|" + rawM + "|" + (prodStr || ""))
                .replace(/\s+/g, " ")
                .slice(0, 120);
            }
            splitProducts(prodStr).forEach(function (pn) {
              var key = pn.toLowerCase().trim();
              if (pn && !existNames[key] && !newProds[key]) newProds[key] = pn;
            });
            var data = {
              sell: ci.sell > -1 ? num(r[ci.sell]) : 0,
              buy: costFromProducts(prodStr),
              delivery: ci.deliv > -1 ? num(r[ci.deliv]) : 0,
              status: mapStatus(ci.status > -1 ? r[ci.status] : ""),
              date: parseDate(ci.date > -1 ? r[ci.date] : ""),
              qty: qty,
              city: ci.city > -1 ? (r[ci.city] || "").trim() : "",
              note: nm || (prodStr ? prodStr.slice(0, 40) : "Commande " + ref),
              product: prodStr,
            };
            if (ref && idx[ref]) {
              var o = idx[ref];
              o.sell = data.sell;
              o.buy = data.buy;
              o.delivery = data.delivery;
              o.status = data.status;
              o.date = data.date;
              o.qty = data.qty;
              o.city = data.city;
              o.product = data.product;
              if (nm) o.note = nm;
              updated++;
              continue;
            }
            var no = { id: uid(), ref: ref, returnFee: "" };
            for (var key2 in data) no[key2] = data[key2];
            orders.unshift(no);
            if (ref) idx[ref] = no;
            added++;
          }
          var addedProds = 0;
          Object.keys(newProds).forEach(function (k) {
            products.push({
              id: uid(),
              name: newProds[k],
              sell: "",
              buy: "",
              delivery: "",
            });
            addedProds++;
          });
          save("orders", orders);
          save("products", products);
          render();
          alert(
            added +
              " commande(s) importée(s)" +
              (updated ? " · " + updated + " mise(s) à jour" : "") +
              (addedProds ? " · " + addedProds + " produit(s) ajouté(s)" : "")
          );
        };
        rdr.readAsText(file, "UTF-8");
        ev.target.value = "";
      }

      /* ===================== ANALYSE ===================== */
      function prodKey(o) {
        var p = splitProducts(o.product || "");
        return (p[0] || o.product || "Sans produit").trim() || "Sans produit";
      }
      function viewAnalyse() {
        var delivered = orders.filter(function (o) {
          return o.status === "delivered";
        });
        var returned = orders.filter(function (o) {
          return o.status === "returned";
        });
        if (orders.length === 0) {
          return '<div class="panel"><p class="empty">Pas encore de données. Importe ton CSV ou ajoute des commandes, puis reviens ici.</p></div>';
        }

        /* ---- par produit ---- */
        var P = {};
        delivered.forEach(function (o) {
          var k = prodKey(o);
          P[k] = P[k] || { name: k, rev: 0, profit: 0, n: 0, ret: 0 };
          P[k].rev += num(o.sell);
          P[k].profit += num(o.sell) - num(o.buy) - num(o.delivery);
          P[k].n++;
        });
        returned.forEach(function (o) {
          var k = prodKey(o);
          P[k] = P[k] || { name: k, rev: 0, profit: 0, n: 0, ret: 0 };
          P[k].ret++;
        });
        var plist = Object.keys(P)
          .map(function (k) {
            return P[k];
          })
          .sort(function (a, b) {
            return b.profit - a.profit;
          });

        var prodRows =
          plist.length === 0
            ? '<p class="empty">Aucune vente livrée pour le moment.</p>'
            : plist
                .map(function (p) {
                  var tot = p.n + p.ret,
                    tr = tot > 0 ? Math.round((p.ret / tot) * 100) : 0;
                  var col =
                    p.profit > 0
                      ? "var(--green)"
                      : p.profit < 0
                      ? "var(--red)"
                      : "var(--muted)";
                  return (
                    '<div class="li"><div class="li-main"><div class="li-top"><span class="li-title">' +
                    esc(p.name) +
                    "</span>" +
                    '<span class="badge" style="color:var(--teal);background:var(--teal)22">' +
                    p.n +
                    " vendus</span>" +
                    (tr >= 30
                      ? '<span class="badge" style="color:var(--red);background:var(--red)22">retours ' +
                        tr +
                        "%</span>"
                      : "") +
                    "</div>" +
                    '<div class="li-sub">Chiffre: ' +
                    fmt(p.rev) +
                    "</div></div>" +
                    '<div class="li-right"><span class="pl" style="color:' +
                    col +
                    '">' +
                    fmt(p.profit) +
                    "</span></div></div>"
                  );
                })
                .join("");

        /* ---- par ville ---- */
        var V = {};
        delivered.forEach(function (o) {
          var c = (o.city || "").trim() || "Inconnue";
          V[c] = V[c] || { name: c, rev: 0, profit: 0, n: 0 };
          V[c].rev += num(o.sell);
          V[c].profit += num(o.sell) - num(o.buy) - num(o.delivery);
          V[c].n++;
        });
        var vlist = Object.keys(V)
          .map(function (k) {
            return V[k];
          })
          .sort(function (a, b) {
            return b.rev - a.rev;
          });
        var hasCity = vlist.some(function (v) {
          return v.name !== "Inconnue";
        });
        var villeRows = !hasCity
          ? '<p class="hint" style="margin:0">Pas de villes enregistrées. Réimporte ton CSV (la colonne "City" sera lue automatiquement) pour voir où vont tes ventes.</p>'
          : vlist
              .slice(0, 12)
              .map(function (v) {
                return (
                  '<div class="li"><div class="li-main"><div class="li-top"><span class="li-title">' +
                  esc(v.name) +
                  "</span>" +
                  '<span class="badge" style="color:var(--gold);background:var(--gold)22">' +
                  v.n +
                  " cmd</span></div>" +
                  '<div class="li-sub">Profit: ' +
                  fmt(v.profit) +
                  "</div></div>" +
                  '<div class="li-right"><span class="pl">' +
                  fmt(v.rev) +
                  "</span></div></div>"
                );
              })
              .join("");

        /* ---- conseils pub (ROAS) ---- */
        var rev = delivered.reduce(function (s, o) {
          return s + num(o.sell);
        }, 0);
        var cogs = delivered.reduce(function (s, o) {
          return s + num(o.buy);
        }, 0);
        var delc = delivered.reduce(function (s, o) {
          return s + num(o.delivery);
        }, 0);
        var ads = expenses
          .filter(function (e) {
            return e.type === "ads";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var grossMargin = rev - cogs - delc; // avant pub
        var marginRatio = rev > 0 ? grossMargin / rev : 0;
        var roas = ads > 0 ? rev / ads : 0;
        var breakeven = marginRatio > 0 ? 1 / marginRatio : 0;
        var adsTxt = "";
        if (ads <= 0) {
          adsTxt =
            "Tu n'as pas encore enregistré de dépenses publicitaires. Ajoute-les dans l'onglet Dépenses pour calculer ton ROAS.";
        } else if (marginRatio <= 0) {
          adsTxt =
            "⚠️ Ta marge avant pub est négative : tu perds de l'argent même sans compter la pub. Revois tes prix d'achat / de vente avant de dépenser en pub.";
        } else {
          var status =
            roas >= breakeven * 1.3
              ? "🟢 Très rentable"

          adsTxt =
            "Ton ROAS actuel est <b>" +
            roas.toFixed(2) +
            "x</b>. Ton seuil de rentabilité (break-even) est <b>" +
            breakeven.toFixed(2) +
            "x</b>. (" +
            status +
            ")<br>";
          if (roas >= breakeven * 1.3)
            adsTxt +=
              "👉 Tu gagnes bien sur chaque dinar de pub. Tu peux <b>augmenter le budget</b> progressivement (+20% à la fois) en surveillant le ROAS.";
          else if (roas >= breakeven)
            adsTxt +=
              "👉 Tu es rentable mais la marge est mince. <b>Optimise</b> (meilleures audiences/créatives) avant d'augmenter le budget.";
          else

              "👉 Tu perds de l'argent sur la pub. <b>Baisse le budget</b>, coupe les pubs faibles, ou augmente la marge (prix/coût) avant de continuer.";
        }

        /* ---- alertes ---- */
        var alerts = [];
        var noCost = products.filter(function (p) {

        if (noCost.length)
          alerts.push(
            "🛒 " +

              " produit(s) sans prix d'achat — renseigne-les dans Produits puis clique « Recalculer les coûts » pour un profit exact."
          );
        plist.forEach(function (p) {

        plist.forEach(function (p) {

        });
        var totDR = delivered.length + returned.length;
        if (totDR >= 10) {
          var dr = Math.round((delivered.length / totDR) * 100);
          if (dr < 60)
            alerts.push(

        /* meilleur jour */
        var D = {};

          if (d) {

      function aiSummary() {
        var d = orders.filter(function (o) {
          return o.status === "delivered";
        });
        var r = orders.filter(function (o) {
          return o.status === "returned";
        });
        var p = orders.filter(function (o) {
          return o.status === "pending";
        });
        var rev = d.reduce(function (s, o) {
          return s + num(o.sell);
        }, 0);
        var cogs = d.reduce(function (s, o) {
          return s + num(o.buy);
        }, 0);
        var delc = d.reduce(function (s, o) {
          return s + num(o.delivery);
        }, 0);
        var ads = expenses
          .filter(function (e) {
            return e.type === "ads";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var achat = expenses
          .filter(function (e) {
            return e.type === "achat";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var emb = expenses
          .filter(function (e) {
            return e.type === "emballage";
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var other = expenses
          .filter(function (e) {
            return (
              e.type !== "ads" && e.type !== "achat" && e.type !== "emballage"
            );
          })
          .reduce(function (s, e) {
            return s + num(e.amount);
          }, 0);
        var profit = rev - cogs - delc - ads - achat - emb - other;
        var roas = ads > 0 ? (rev / ads).toFixed(2) : "0";
        var marge = rev > 0 ? ((profit / rev) * 100).toFixed(1) : "0";
        /* produits */
        var PR = {};
        d.forEach(function (o) {
          var k = prodKey(o);
          PR[k] = PR[k] || { n: 0, profit: 0, ret: 0 };
          PR[k].n++;
          PR[k].profit += num(o.sell) - num(o.buy) - num(o.delivery);
        });
        r.forEach(function (o) {
          var k = prodKey(o);
          PR[k] = PR[k] || { n: 0, profit: 0, ret: 0 };
          PR[k].ret++;
        });
        var prods = Object.keys(PR)
          .map(function (k) {
            return {
              name: k,
              n: PR[k].n,
              profit: Math.round(PR[k].profit),
              ret: PR[k].ret,
            };
          })
          .sort(function (a, b) {
            return b.profit - a.profit;
          })
          .slice(0, 10);
        /* villes */
        var CI = {};
        d.forEach(function (o) {
          var c = (o.city || "").trim() || "Inconnue";
          CI[c] = CI[c] || { n: 0, rev: 0 };
          CI[c].n++;
          CI[c].rev += num(o.sell);
        });
        var cities = Object.keys(CI)
          .map(function (c) {
            return { name: c, n: CI[c].n, rev: Math.round(CI[c].rev) };
          })
          .sort(function (a, b) {
            return b.rev - a.rev;
          })
          .slice(0, 8);
        /* comparaison mois */
        var M = monthData();
        var cur = M[0];
        var prev = M[1];
        var monthComp = "";
        if (cur && prev) {
          monthComp =
            "Mois en cours (" +
            monthLabel(cur.key) +
            "): profit=" +
            Math.round(cur.profit) +
            " DT, CA=" +
            Math.round(cur.rev) +
            " DT, livrées=" +
            cur.n +
            ". Mois précédent (" +
            monthLabel(prev.key) +
            "): profit=" +
            Math.round(prev.profit) +
            " DT, CA=" +
            Math.round(prev.rev) +
            " DT, livrées=" +
            prev.n +
            ".";
        }
        /* objectif */
        var goal = getGoal();
        var now = new Date();
        var curKey = now.getFullYear() + "-" + pad(now.getMonth() + 1);
        var curM = M.filter(function (m) {
          return m.key === curKey;
        })[0];
        var curP = curM ? curM.profit : 0;
        var goalLine =
          goal > 0
            ? "Objectif mensuel fixé: " +
              Math.round(goal) +
              " DT. Profit actuel ce mois: " +
              Math.round(curP) +
              " DT (" +
              (goal > 0 ? Math.round((curP / goal) * 100) : 0) +
              "% atteint)."
            : "Aucun objectif mensuel défini.";
        /* résumé */
        var s =
          "Devise: Dinar Tunisien (DT). Modèle: COD (paiement à la livraison) en Tunisie.\n";
        s +=
          "Commandes: livrées=" +
          d.length +
          ", retours=" +
          r.length +
          ", en attente=" +
          p.length +
          ". Taux livraison=" +
          (d.length + r.length > 0
            ? Math.round((d.length / (d.length + r.length)) * 100)
            : 0) +
          "%.\n";
        s += "Recettes=" + Math.round(rev) + " DT. Marge=" + marge + "%.\n";
        s +=
          "Dépenses détaillées: Publicité=" +
          Math.round(ads) +
          " DT | Achat produits=" +
          Math.round(achat) +
          " DT | Emballage/Logistique=" +
          Math.round(emb) +
          " DT | Autres=" +
          Math.round(other) +
          " DT | Livraison=" +
          Math.round(delc) +
          " DT.\n";
        s += "Profit net=" + Math.round(profit) + " DT. ROAS=" + roas + "x.\n";
        if (monthComp) s += monthComp + "\n";
        s += goalLine + "\n";
        s +=
          "Produits (nom | vendus | profit DT | retours): " +
          prods
            .map(function (x) {
              return x.name + " | " + x.n + " | " + x.profit + " | " + x.ret;
            })
            .join(" ;; ") +
          "\n";
        s +=
          "Villes (nom | commandes | CA DT): " +
          (cities.length
            ? cities
                .map(function (x) {
                  return x.name + " | " + x.n + " | " + x.rev;
                })
                .join(" ;; ")
            : "non renseignées") +
          "\n";
        return s;
      }

      function monthLabel(k) {
        var p = k.split("-");
        if (p.length < 2) return k;
        var mi = parseInt(p[1], 10) - 1;
        return (MONTHS_FR[mi] || p[1]) + " " + p[0];

      function monthData() {
        var m = {};
        function get(k) {
          m[k] = m[k] || {
            key: k,
            rev: 0,
            cogs: 0,
            deliv: 0,
            exp: 0,
            n: 0,
            ret: 0,
          };
          return m[k];
        }
        orders.forEach(function (o) {
          var k = (o.date || "").slice(0, 7);
          if (!k) return;
          if (o.status === "delivered") {
            var x = get(k);
            x.rev += num(o.sell);
            x.cogs += num(o.buy);
            x.deliv += num(o.delivery);
            x.n++;
          } else if (o.status === "returned") {
            var y = get(k);
            y.deliv += num(o.returnFee);
            y.ret++;
          }
        });
        expenses.forEach(function (e) {
          var k = (e.date || "").slice(0, 7);
          if (!k) return;
          get(k).exp += num(e.amount);
        });
        return Object.keys(m)
          .map(function (k) {
            var x = m[k];
            x.profit = x.rev - x.cogs - x.deliv - x.exp;
            return x;
          })
          .sort(function (a, b) {
            return b.key.localeCompare(a.key);
          });
      }

            monthLabel(x.key) +
            "</span>" +
            '<span class="badge" style="color:var(--teal);background:var(--teal)22">' +
            x.n +
            " livrées</span></div>" +
            '<div class="li-sub">CA ' +
            fmt(x.rev) +
            " · Achat " +
            fmt(x.cogs) +
            " · Livr. " +
            fmt(x.deliv) +
            " · Pub/autres " +
            fmt(x.exp) +
            "</div></div>" +
            '<div class="li-right"><span class="pl" style="color:' +
            col +
            '">' +
            fmt(x.profit) +
            "</span></div></div>"
          );
        }).join("");
        return (
          "" +
          '<div class="panel noprint"><button class="primary" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button></div>' +
          cmp +
          '<div class="panel"><h3>📈 Profit par mois</h3>' +
          chart +
          "</div>" +
          '<div class="panel"><h3>🗓️ Détail mensuel</h3><div class="list" style="padding:0">' +
          rows +
          "</div></div>"
        );
      }

      function f(label, inner) {
        return (
          '<label class="field"><span>' + label + "</span>" + inner + "</label>"
        );
      }

      /* ---------- actions ---------- */
      function resetAll() {
        if (!confirm("Tout supprimer ? Action irréversible.")) return;
        orders = [];
        expenses = [];
        products = [];
        save("orders", []);
        save("expenses", []);
        save("products", []);
        render();
      }
      function exportCSV() {
        var rows = [
          [
            "Type",
            "Date",
            "Description",
            "Prix vente",
            "Prix achat",
            "Livraison",
            "Statut",
            "Montant",
          ],
        ];
        orders.forEach(function (o) {
          rows.push([
            "Commande",
            o.date,
            o.note || o.product || "",
            o.sell,
            o.buy,
            o.delivery,
            (STATUS[o.status] || {}).label || "",
            "",
          ]);
        });
        expenses.forEach(function (e) {
          rows.push([
            "Dépense",
            e.date,
            e.desc || "",
            "",
            "",
            "",
            e.type === "ads" ? "Publicité" : "Autre",
            e.amount,
          ]);
        });
        var csv =
          "\uFEFF" +
          rows
            .map(function (r) {
              return r
                .map(function (c) {
                  return '"' + (c == null ? "" : c) + '"';
                })
                .join(";");
            })
            .join("\n");
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "dawema-comptable.csv";
        a.click();
      }

      /* ====== LOGIN (Firebase Auth) ====== */
      function showApp() {
        document.getElementById("login").style.display = "none";
        document.getElementById("appwrap").style.display = "block";
        render();
      }
      function showLogin() {
        document.getElementById("appwrap").style.display = "none";
        document.getElementById("login").style.display = "flex";
      }
      function doLogin() {
        var email = document.getElementById("l_user").value.trim(),
          pass = document.getElementById("l_pass").value;
        if (!email || !pass) {
          document.getElementById("l_err").textContent =
            "Remplis l'email et le mot de passe.";
          return;
        }
        document.getElementById("l_err").textContent = "Connexion…";
        fbAuth
          .signInWithEmailAndPassword(email, pass)
          .then(function () {
            document.getElementById("l_err").textContent = "";
            document.getElementById("l_pass").value = "";
          })
          .catch(function (e) {
            document.getElementById("l_err").textContent =
              "Email ou mot de passe incorrect.";
          });
      }
      function logout() {
        fbAuth.signOut();
      }
      var _subscribed = false;
      fbAuth.onAuthStateChanged(function (user) {
        if (user) {
          if (!_subscribed) {
            _subscribed = true;
            subscribeData();
          }
          showApp();
        } else {
          showLogin();
        }
      });
    </script>
  </body>
</html>
